<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axtra Credits</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #151515;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #00c3ff;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 195, 255, 0.2);
        }
        input {
            padding: 10px;
            margin: 15px 0;
            background: #222;
            border: 1px solid #00c3ff;
            color: white;
            border-radius: 5px;
            text-align: center;
            width: 80%;
        }
        button {
            background: #00c3ff;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover { background: #0088cc; }
        #reponse { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Quelle est votre ID Discord ?</h2>
        <input type="text" id="discordId" placeholder="Ex: 123456789012345678">
        <br>
        <button onclick="donnerCredits()">Valider</button>
        <p id="reponse"></p>
    </div>

    <script>
        async function donnerCredits() {
            const id = document.getElementById('discordId').value;
            const reponseTexte = document.getElementById('reponse');

            if (!id) {
                reponseTexte.innerText = "❌ Met ton ID d'abord !";
                reponseTexte.style.color = "red";
                return;
            }

            reponseTexte.innerText = "⏳ Vérification...";
            reponseTexte.style.color = "white";

            try {
                // On envoie l'ID à ton bot sur Katabump
                const res = await fetch('/api/claim', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ discordId: id })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    reponseTexte.innerText = `✅ Succès ! 10 crédits ajoutés sur le compte.`;
                    reponseTexte.style.color = "#00ffaa";
                } else {
                    reponseTexte.innerText = `❌ ${data.message}`;
                    reponseTexte.style.color = "red";
                }
            } catch (err) {
                reponseTexte.innerText = "❌ Le serveur (Katabump) est éteint.";
                reponseTexte.style.color = "red";
            }
        }
    </script>
</body>
</html>
