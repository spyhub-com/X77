<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7X STUDIO | GALAXY V7 HYZER</title>

    <meta property="og:title" content="7X STUDIO - GALAXY V7">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Studio mobile ultime. Générateur HYZER.">
    <meta name="theme-color" content="#bc4be3">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #050508;
            --bg-panel: #0d0d16;
            --accent: #bc4be3;
            --accent-glow: rgba(188, 75, 227, 0.5);
            --cyan: #00d4ff;
            --text: #f5f5f7;
            --text-muted: #86868b;
            --border: rgba(255, 255, 255, 0.08);
            --grad-gal: linear-gradient(135deg, #050508 0%, #11112b 100%);
            --grad-btn: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            --grad-text: linear-gradient(90deg, var(--cyan), var(--accent));
        }

        /* --- KEYFRAMES --- */
        @keyframes popCenter {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes bgFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 10px var(--accent-glow); }
            50% { text-shadow: 0 0 25px var(--accent); }
        }

        @keyframes cubeFly {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }

        /* --- BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--grad-gal);
            background-size: 300% 300%;
            animation: bgFlow 15s infinite ease;
            color: var(--text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- PARTICULES VIOLETTES --- */
        .background-particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            display: block;
            background-color: var(--accent);
            box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
            border-radius: 50%;
            bottom: -150px;
            animation: cubeFly 25s linear infinite;
            opacity: 0;
        }

        .particle:nth-child(1) { left: 25%; width: 6px; height: 6px; animation-delay: 0s; animation-duration: 20s; }
        .particle:nth-child(2) { left: 10%; width: 4px; height: 4px; animation-delay: 2s; background-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
        .particle:nth-child(3) { left: 70%; width: 5px; height: 5px; animation-delay: 4s; }
        .particle:nth-child(4) { left: 40%; width: 7px; height: 7px; animation-delay: 0s; animation-duration: 18s; }
        .particle:nth-child(5) { left: 65%; width: 4px; height: 4px; animation-delay: 0s; }
        .particle:nth-child(6) { left: 15%; width: 6px; height: 6px; animation-delay: 3s; background-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
        .particle:nth-child(7) { left: 88%; width: 8px; height: 8px; animation-delay: 7s; }
        .particle:nth-child(8) { left: 50%; width: 4px; height: 4px; animation-delay: 15s; }
        .particle:nth-child(9) { left: 20%; width: 5px; height: 5px; animation-delay: 2s; }
        .particle:nth-child(10) { left: 85%; width: 6px; height: 6px; animation-delay: 0s; }

        /* --- UI ELEMENTS --- */
        #splash-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg-deep);
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }

        .login-box {
            width: 88%; max-width: 380px; padding: 40px 30px;
            background: rgba(13, 13, 22, 0.85); border: 1px solid var(--border);
            border-radius: 28px; text-align: center;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            position: relative; z-index: 10;
        }

        .gal-title-big {
            font-size: 3rem; font-weight: 950; letter-spacing: -2px;
            background: var(--grad-text);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: titleGlow 3s infinite;
        }

        .gal-input {
            width: 100%; padding: 16px 20px; background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border); border-radius: 14px;
            color: white; font-size: 1rem; margin: 25px 0 15px; text-align: center;
        }

        .gal-btn {
            width: 100%; padding: 18px; border: none; border-radius: 14px;
            background: var(--grad-btn); color: white; font-weight: 800;
            text-transform: uppercase; cursor: pointer;
        }

        header {
            height: 70px; background: rgba(13, 13, 22, 0.5);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; z-index: 100; position: relative;
        }

        .header-center { position: absolute; left: 50%; transform: translateX(-50%); }

        .btn-icon {
            width: 44px; height: 44px; background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: var(--cyan); font-size: 1.2rem; transition: 0.3s;
        }

        /* --- SIDE MENU --- */
        #side-menu {
            position: fixed; top: 0; left: -110%; width: 85%; max-width: 320px; height: 100%;
            background: rgba(8, 8, 16, 0.98); z-index: 10000;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 30px 20px; border-right: 1px solid var(--border);
            overflow-y: auto;
        }
        #side-menu.active { left: 0; box-shadow: 20px 0 60px rgba(0,0,0,0.8); }

        .menu-section-title {
            font-size: 0.7rem; font-weight: 900; letter-spacing: 1.5px;
            background: var(--grad-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 25px 0 10px; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 5px;
        }

        .menu-btn {
            width: 100%; padding: 12px 15px; background: rgba(255,255,255,0.02);
            border: 1px solid transparent; border-radius: 10px; color: var(--text);
            font-size: 0.85rem; text-align: left; margin-bottom: 8px; display: flex;
            align-items: center; gap: 12px; font-weight: 500; cursor: pointer;
        }
        .menu-btn i { color: var(--accent); width: 18px; text-align: center; }

        .file-item {
            padding: 14px; background: rgba(255,255,255,0.02); border-radius: 12px;
            margin-bottom: 8px; display: flex; justify-content: space-between;
            align-items: center; font-size: 0.8rem; border: 1px solid transparent;
        }
        .file-item.active { background: rgba(188, 75, 227, 0.1); border-color: var(--accent); color: var(--accent); }

        main { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 10; }

        .action-bar {
            padding: 10px 20px; background: rgba(13, 13, 22, 0.3);
            display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border);
        }

        #editor-area {
            flex: 1; width: 100%; background: transparent; color: #e2e2e7;
            padding: 20px; font-family: 'Fira Code', monospace; font-size: 13px;
            line-height: 1.6; border: none; outline: none; resize: none;
        }

        #pop-overlay { position: fixed; inset: 0; z-index: 10001; pointer-events: none; }
        .pop-msg-center {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 280px; background: rgba(13, 13, 22, 0.95); border: 1px solid var(--accent);
            border-radius: 24px; padding: 25px; text-align: center; color: white;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); animation: popCenter 0.4s ease forwards;
        }
        .pop-msg-center i { display: block; font-size: 2.5rem; margin-bottom: 12px; color: var(--cyan); }

        .footer { height: 40px; background: rgba(13, 13, 22, 0.5); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 0.6rem; color: var(--text-muted); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10005; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    </style>
</head>
<body>

    <div class="background-particles">
        <span class="particle"></span><span class="particle"></span><span class="particle"></span>
        <span class="particle"></span><span class="particle"></span><span class="particle"></span>
        <span class="particle"></span><span class="particle"></span><span class="particle"></span>
        <span class="particle"></span>
    </div>

    <div id="pop-overlay"></div>

    <div id="splash-screen">
        <div class="login-box">
            <h1 class="gal-title-big">7X</h1>
            <p style="color: var(--text-muted); font-size: 0.7rem; letter-spacing: 2px;">GALAXY HYZER-V7</p>
            <input type="text" id="nick-input" class="gal-input" placeholder="IDENTIFIANT" maxlength="15">
            <button class="gal-btn" onclick="boot()">INITIALISER</button>
        </div>
    </div>

    <header>
        <div class="btn-icon" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></div>
        <div class="header-center"><h1 class="gal-title-big" style="font-size: 1.8rem;">7X</h1></div>
        <div class="btn-icon" onclick="toggleFS()"><i class="fa-solid fa-expand"></i></div>
    </header>

    <aside id="side-menu">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="font-weight: 900; color: white;">PANNEAU 7X</h2>
            <div class="btn-icon" style="width: 35px; height: 35px;" onclick="toggleMenu()"><i class="fa-solid fa-xmark"></i></div>
        </div>

        <div class="menu-section-title">EXPLORATEUR</div>
        <div style="display:flex; gap:10px;">
            <button class="menu-btn" style="justify-content:center; flex:1;" onclick="openCreator('folder')"><i class="fa-solid fa-folder-plus"></i></button>
            <button class="menu-btn" style="justify-content:center; flex:1;" onclick="openCreator('file')"><i class="fa-solid fa-file-circle-plus"></i></button>
        </div>
        <div id="explorer-root"></div>

        <div class="menu-section-title">OUTILS GALAXY</div>
        <button class="menu-btn" onclick="obfuscateCode()"><i class="fa-solid fa-shield-halved"></i> Obfusquer LUA</button>
        <button class="menu-btn" onclick="formatCode()"><i class="fa-solid fa-wand-magic-sparkles"></i> Nettoyer le code</button>

        <div class="menu-section-title">SNIPPETS</div>
        <button class="menu-btn" onclick="insertSnippet('esp')"><i class="fa-solid fa-street-view"></i> Base ESP</button>
        <button class="menu-btn" onclick="insertSnippet('ui')"><i class="fa-solid fa-window-restore"></i> Orion UI Hub</button>
        <button class="menu-btn" onclick="insertSnippet('fly')"><i class="fa-solid fa-jet-fighter-up"></i> Fly Mobile</button>

        <div class="menu-section-title">SYSTÈME</div>
        <button class="menu-btn" onclick="clearData()" style="color: #ff4b4b;"><i class="fa-solid fa-power-off"></i> Vider le cache</button>
    </aside>

    <main>
        <div class="action-bar">
            <div id="file-name-display" style="font-size: 0.8rem; font-weight: 700; color: var(--cyan);"><i class="fa-solid fa-code"></i> TERMINAL</div>
            <div style="display:flex; gap:10px;">
                <button class="btn-icon" style="width:36px; height:36px; background:#b91c1c; color:white; border:none;" onclick="obfuscateCode()"><i class="fa-solid fa-lock"></i></button>
                <button class="btn-icon" style="width:36px; height:36px; background:#2ea44f; color:white; border:none;" onclick="generateLoadstring()"><i class="fa-solid fa-link"></i></button>
                <button class="btn-icon" style="width:36px; height:36px; background:var(--accent); color:white; border:none;" onclick="saveActiveFile()"><i class="fa-solid fa-floppy-disk"></i></button>
            </div>
        </div>
        <textarea id="editor-area" spellcheck="false" placeholder="-- Collez votre script LUA ici..."></textarea>
        <div class="footer">
            <div id="line-stat">LIGNES: 0</div>
            <div id="user-label" style="color:var(--cyan); font-weight: 900;">GALAXY-V7</div>
            <div style="font-weight: 800; color: var(--text-muted);">© 7X STUDIO</div>
        </div>
    </main>

    <div class="modal-overlay" id="modal-box">
        <div class="login-box" style="background: var(--bg-panel);">
            <h3 id="modal-head" style="color:white; margin-bottom: 5px;">NOUVEAU</h3>
            <input type="text" id="modal-input" class="gal-input" placeholder="NOM...">
            <div style="display:flex; gap:10px;">
                <button class="gal-btn" style="background:rgba(255,255,255,0.05); flex:1;" onclick="closeModal()">ANNULER</button>
                <button class="gal-btn" style="flex:1;" onclick="confirmAction()">CRÉER</button>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1474669361611538443/uW_m9kt05hykPUZQ_0v4sYw6-xkNsgYKF_WnP-Hc1ckg42bIRG8VPZWdrPsXfkbfQdgy";
        let db = JSON.parse(localStorage.getItem('7X_V7_DB')) || { "ASSETS": [{ n: "MAIN.LUA", c: "-- 7X Studio V7\nprint('Galaxy Engine Ready')\n" }] };
        let activeFile = null; let actionTarget = '';

        function notify(text, icon) {
            const container = document.getElementById('pop-overlay');
            const el = document.createElement('div'); el.className = 'pop-msg-center';
            el.innerHTML = `<i class="${icon}"></i><b>${text}</b>`;
            container.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 2000);
        }

        function boot() {
            const nick = document.getElementById('nick-input').value.trim();
            if(!nick) return;
            document.getElementById('user-label').innerText = nick.toUpperCase();
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; }, 500);
            renderFiles();
            notify('Système Prêt', 'fa-solid fa-circle-check');
        }

        function obfuscateCode() {
            const area = document.getElementById('editor-area');
            const code = area.value.trim();
            if(!code) return notify('Vide !', 'fa-solid fa-circle-xmark');
            let bytes = [];
            for (let i = 0; i < code.length; i++) bytes.push(code.charCodeAt(i));
            area.value = `-- [[ OBFUSQUÉ PAR 7X STUDIO ]]\nlocal _b = {${bytes.join(',')}}\nlocal _s = ""\nfor _, v in ipairs(_b) do _s = _s .. string.char(v) end\nloadstring(_s)()`;
            notify('Code Crypter', 'fa-solid fa-shield-check');
        }

        function insertSnippet(type) {
            let code = "";
            if(type === 'esp') code = `-- ESP HIGHLIGHT\nlocal h = Instance.new("Highlight", game.Players.LocalPlayer.Character)\nh.FillColor = Color3.fromRGB(188, 75, 227)`;
            if(type === 'ui') code = `-- ORION UI\nlocal Lib = loadstring(game:HttpGet('https://raw.githubusercontent.com/shlexsoftware/Orion/main/source'))()\nlocal Win = Lib:MakeWindow({Name = "7X Hub"})`;
            if(type === 'fly') code = `-- FLY MOBILE\nlocal lp = game.Players.LocalPlayer\nlocal mouse = lp:GetMouse()\n-- Base Fly script...`;
            document.getElementById('editor-area').value += "\n" + code;
            updateStats(); toggleMenu();
        }

        function renderFiles() {
            const root = document.getElementById('explorer-root'); root.innerHTML = '';
            for (let folder in db) {
                const head = document.createElement('div'); head.className = "menu-section-title";
                head.innerHTML = `<i class="fa-solid fa-folder"></i> ${folder}`; root.appendChild(head);
                db[folder].forEach((file, idx) => {
                    const item = document.createElement('div');
                    item.className = `file-item ${activeFile && activeFile.f === folder && activeFile.i === idx ? 'active' : ''}`;
                    item.innerHTML = `<span><i class="fa-solid fa-file-code" style="color:var(--cyan)"></i> ${file.n}</span> <i class="fa-solid fa-trash" style="color:#ff4b4b" onclick="deleteFile('${folder}', ${idx})"></i>`;
                    item.onclick = (e) => { if(e.target.tagName !== 'I') openFile(folder, idx); };
                    root.appendChild(item);
                });
            }
        }

        function openFile(f, i) {
            activeFile = { f, i };
            document.getElementById('editor-area').value = db[f][i].c;
            document.getElementById('file-name-display').innerText = db[f][i].n;
            toggleMenu(); updateStats(); renderFiles();
        }

        function saveActiveFile() {
            if(!activeFile) return;
            db[activeFile.f][activeFile.i].c = document.getElementById('editor-area').value;
            localStorage.setItem('7X_V7_DB', JSON.stringify(db));
            notify('Sauvegardé', 'fa-solid fa-floppy-disk');
        }

        async function generateLoadstring() {
            const content = document.getElementById('editor-area').value.trim();
            if(!content) return notify('Vide !', 'fa-solid fa-triangle-exclamation');
            notify('Génération...', 'fa-solid fa-link fa-spin');
            try {
                const res = await fetch('https://bytebin.lucko.me/post', { method: 'POST', body: content });
                const data = await res.json();
                const code = `loadstring(game:HttpGet("https://bytebin.lucko.me/${data.key}"))()`;
                await navigator.clipboard.writeText(code);
                notify('Code Copié !', 'fa-solid fa-crown');
            } catch(e) { notify('Erreur', 'fa-solid fa-wifi'); }
        }

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('active'); }
        function toggleFS() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function formatCode() { document.getElementById('editor-area').value = document.getElementById('editor-area').value.trim(); notify('Nettoyé', 'fa-solid fa-wand-magic-sparkles'); }
        function openCreator(m) { actionTarget = m; document.getElementById('modal-box').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal-box').style.display = 'none'; }
        function confirmAction() {
            const val = document.getElementById('modal-input').value.trim().toUpperCase();
            if(!val) return;
            if(actionTarget === 'folder') { if(!db[val]) db[val] = []; }
            else { db[Object.keys(db)[0]].push({ n: val + ".LUA", c: "-- Script\n" }); }
            localStorage.setItem('7X_V7_DB', JSON.stringify(db)); renderFiles(); closeModal();
        }
        function deleteFile(f, i) { if(confirm("Supprimer ?")) { db[f].splice(i, 1); localStorage.setItem('7X_V7_DB', JSON.stringify(db)); renderFiles(); } }
        function clearData() { if(confirm("Supprimer tout ?")) { localStorage.clear(); location.reload(); } }
        function updateStats() { document.getElementById('line-stat').innerText = 'LIGNES: ' + (document.getElementById('editor-area').value.split('\n').length); }
        document.getElementById('editor-area').addEventListener('input', updateStats);
    </script>
</body>
</html>
