<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Axtra Credits</title>
    <style>
        body { background: #0d0d0d; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: #151515; padding: 30px; border-radius: 10px; border: 1px solid #00c3ff; text-align: center; box-shadow: 0 0 15px #00c3ff; }
        input { padding: 12px; margin-bottom: 20px; background: #222; border: 1px solid #00c3ff; color: white; border-radius: 5px; width: 250px; text-align: center; }
        button { background: #00c3ff; color: #000; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%; }
        #res { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Axtra Credits</h2>
        <p>Quelle est votre ID Discord ?</p>
        <input type="text" id="uid" placeholder="ID Discord">
        <br>
        <button onclick="claim()">VALIDER</button>
        <p id="res"></p>
    </div>

    <script>
        // Tes clés JSONBin directement dans le script
        const BIN_ID = "69c3d98bb7ec241ddca074ea";
        const KEY = "$2a$10$EBYT18QsDuSLonTCcO0ipuqMzAZErZtyTS4U7Qybk92N.jQWHeaTG";

        async function claim() {
            const id = document.getElementById('uid').value;
            const r = document.getElementById('res');
            if(!id) return r.innerText = "❌ Met ton ID !";
            
            r.innerText = "⏳ Connexion...";
            r.style.color = "white";

            try {
                // 1. On récupère les données
                const resp = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { "X-Master-Key": KEY }
                });
                const data = await resp.json();
                let db = data.record;
                if (!db.users) db.users = {};

                const now = Date.now();
                // 2. Vérif 24h
                if (db.users[id] && (now - db.users[id].lastReset < 86400000)) {
                    r.innerText = "❌ Déjà réclamé aujourd'hui !";
                    r.style.color = "red";
                    return;
                }

                // 3. Update local
                db.users[id] = { 
                    credits: (db.users[id]?.credits || 0) + 10, 
                    lastReset: now 
                };

                // 4. Sauvegarde sur JSONBin
                const save = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 
                        "Content-Type": "application/json",
                        "X-Master-Key": KEY 
                    },
                    body: JSON.stringify(db)
                });

                if(save.ok) {
                    r.innerText = "✅ 10 Crédits ajoutés !";
                    r.style.color = "#00ffaa";
                } else {
                    r.innerText = "❌ Erreur JSONBin";
                    r.style.color = "red";
                }
            } catch(e) {
                r.innerText = "❌ Erreur Réseau (CORS)";
                r.style.color = "red";
            }
        }
    </script>
</body>
</html>
