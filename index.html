<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7X STUDIO | GALAXY V7 HYZER</title>
    <meta property="og:title" content="7X STUDIO - GALAXY V7">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Studio mobile ultime. Générateur HYZER.">
    <meta name="theme-color" content="#bc4be3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #050508;
            --bg-panel: #0d0d16;
            --accent: #bc4be3;
            --accent-glow: rgba(188, 75, 227, 0.5);
            --cyan: #00d4ff;
            --text: #f5f5f7;
            --text-muted: #86868b;
            --border: rgba(255, 255, 255, 0.08);
            --grad-gal: linear-gradient(135deg, #050508 0%, #11112b 100%);
            --grad-btn: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        @keyframes popCenter {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        @keyframes bgFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 10px var(--accent-glow); }
            50% { text-shadow: 0 0 25px var(--accent); }
        }
        @keyframes cubeFly {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }
        @keyframes adminSlideIn {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        @keyframes scanline {
            0% { top: -5%; }
            100% { top: 105%; }
        }
        @keyframes logFadeIn {
            0% { opacity: 0; transform: translateX(-15px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--grad-gal);
            background-size: 300% 300%;
            animation: bgFlow 15s infinite ease;
            color: var(--text);
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
            position: relative;
        }

        .background-particles {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 1; pointer-events: none;
        }
        .particle {
            position: absolute; display: block; list-style: none;
            background-color: var(--accent);
            box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
            border-radius: 50%; bottom: -150px;
            animation: cubeFly 25s linear infinite; opacity: 0;
        }
        .particle:nth-child(1) { left: 25%; width: 6px; height: 6px; animation-delay: 0s; animation-duration: 20s; }
        .particle:nth-child(2) { left: 10%; width: 4px; height: 4px; animation-delay: 2s; animation-duration: 25s; background-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
        .particle:nth-child(3) { left: 70%; width: 5px; height: 5px; animation-delay: 4s; }
        .particle:nth-child(4) { left: 40%; width: 7px; height: 7px; animation-delay: 0s; animation-duration: 18s; }
        .particle:nth-child(5) { left: 65%; width: 4px; height: 4px; animation-delay: 0s; }
        .particle:nth-child(6) { left: 15%; width: 6px; height: 6px; animation-delay: 3s; background-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
        .particle:nth-child(7) { left: 88%; width: 8px; height: 8px; animation-delay: 7s; }
        .particle:nth-child(8) { left: 50%; width: 4px; height: 4px; animation-delay: 15s; animation-duration: 45s; }
        .particle:nth-child(9) { left: 20%; width: 5px; height: 5px; animation-delay: 2s; animation-duration: 35s; }
        .particle:nth-child(10) { left: 85%; width: 6px; height: 6px; animation-delay: 0s; animation-duration: 11s; }

        #splash-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg-deep);
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .login-box {
            width: 88%; max-width: 380px; padding: 40px 30px;
            background: rgba(13, 13, 22, 0.8); border: 1px solid var(--border);
            border-radius: 28px; text-align: center;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            position: relative; z-index: 10;
        }
        .gal-title-big {
            font-size: 3rem; font-weight: 950; letter-spacing: -2px;
            background: linear-gradient(to right, var(--cyan), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: titleGlow 3s infinite;
        }
        .gal-input {
            width: 100%; padding: 16px 20px; background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border); border-radius: 14px;
            color: white; font-size: 1rem; margin: 25px 0 15px; text-align: center;
        }
        .gal-btn {
            width: 100%; padding: 18px; border: none; border-radius: 14px;
            background: var(--grad-btn); color: white; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            position: relative; overflow: hidden;
        }
        .gal-btn::after {
            content: ''; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%;
            background: rgba(255,255,255,0.2); transform: rotate(30deg); transition: 0.5s;
        }
        .gal-btn:hover::after { left: 120%; }

        header {
            height: 70px; background: rgba(13, 13, 22, 0.5);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; z-index: 100; position: relative;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        .header-center { position: absolute; left: 50%; transform: translateX(-50%); }
        .btn-icon {
            width: 44px; height: 44px; background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: var(--cyan); font-size: 1.2rem; transition: 0.3s; cursor: pointer;
        }
        .btn-icon:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }

        #side-menu {
            position: fixed; top: 0; left: -100%; width: 85%; height: 100%;
            background: rgba(8, 8, 16, 0.95); z-index: 1000;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 30px 20px; border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        #side-menu.active { left: 0; box-shadow: 20px 0 60px rgba(0,0,0,0.8); }
        .explorer { flex: 1; overflow-y: auto; margin-top: 20px; }
        .file-item {
            padding: 16px; background: rgba(255,255,255,0.02); border-radius: 14px;
            margin-bottom: 10px; display: flex; justify-content: space-between;
            align-items: center; border: 1px solid transparent; transition: 0.2s;
        }
        .file-item:active { background: rgba(255,255,255,0.05); }
        .file-item.active { background: rgba(188, 75, 227, 0.1); border-color: rgba(188, 75, 227, 0.3); color: var(--accent); }

        main { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 10; }
        .action-bar {
            padding: 12px 20px; background: rgba(13, 13, 22, 0.3);
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        #editor-area {
            flex: 1; width: 100%; background: transparent; color: #e2e2e7;
            padding: 20px; font-family: 'Fira Code', monospace; font-size: 13px;
            line-height: 1.6; border: none; outline: none; resize: none;
            position: relative; z-index: 2;
        }
        #pop-overlay { position: fixed; inset: 0; z-index: 10001; pointer-events: none; }
        .pop-msg-center {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 320px; background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
            padding: 30px 20px; text-align: center; color: white;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: popCenter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: auto;
        }
        .pop-msg-center i { display: block; font-size: 3rem; margin-bottom: 15px; background: linear-gradient(to bottom, #fff, var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .pop-msg-center b { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
        .footer {
            height: 40px; background: rgba(13, 13, 22, 0.5); border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; font-size: 0.6rem; color: var(--text-muted);
            position: relative; z-index: 10;
        }
        .cp-text { font-weight: 800; letter-spacing: 0.5px; color: var(--cyan); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10005; align-items: center; justify-content: center; backdrop-filter: blur(5px); }

        /* =============================================
           ADMIN PANEL STYLES
           ============================================= */
        #admin-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 20000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
        }
        #admin-overlay.active { display: flex; }

        #admin-panel {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 95%; max-width: 680px;
            max-height: 88vh;
            background: linear-gradient(160deg, #070710 0%, #0f0f22 100%);
            border: 1px solid rgba(188, 75, 227, 0.35);
            border-radius: 24px;
            box-shadow:
                0 0 0 1px rgba(0,212,255,0.08),
                0 0 60px rgba(188,75,227,0.2),
                0 40px 80px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: adminSlideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Scanline effect */
        #admin-panel::before {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(0,212,255,0.4), transparent);
            animation: scanline 4s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        .admin-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            background: linear-gradient(90deg, rgba(188,75,227,0.08), transparent);
            flex-shrink: 0;
        }

        .admin-header-left { display: flex; align-items: center; gap: 12px; }

        .admin-badge {
            width: 40px; height: 40px; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #667eea);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: white;
            box-shadow: 0 0 20px rgba(188,75,227,0.5);
        }

        .admin-title-block h2 {
            font-size: 1rem; font-weight: 900; letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .admin-title-block p {
            font-size: 0.6rem; color: var(--text-muted);
            letter-spacing: 1px; text-transform: uppercase;
            margin-top: 2px;
        }

        .admin-live-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #2ea44f;
            box-shadow: 0 0 8px #2ea44f;
            animation: pulse 1.5s infinite;
            display: inline-block; margin-right: 6px;
        }

        .admin-stats-bar {
            padding: 14px 24px;
            display: flex; gap: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
            overflow-x: auto;
        }

        .stat-chip {
            flex: 1; min-width: 80px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px; padding: 10px 14px;
            text-align: center;
        }
        .stat-chip .val {
            font-size: 1.4rem; font-weight: 900;
            background: linear-gradient(90deg, var(--cyan), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: block;
        }
        .stat-chip .lbl {
            font-size: 0.55rem; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1px; margin-top: 2px;
        }

        .admin-filter-bar {
            padding: 12px 24px;
            display: flex; gap: 8px; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
            overflow-x: auto;
        }

        .filter-btn {
            padding: 7px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            background: transparent; color: var(--text-muted); font-size: 0.65rem;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            white-space: nowrap; transition: 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: rgba(188,75,227,0.15);
            border-color: rgba(188,75,227,0.4);
            color: var(--accent);
        }

        .admin-log-container {
            flex: 1; overflow-y: auto; padding: 16px 24px;
            scroll-behavior: smooth;
        }
        .admin-log-container::-webkit-scrollbar { width: 4px; }
        .admin-log-container::-webkit-scrollbar-track { background: transparent; }
        .admin-log-container::-webkit-scrollbar-thumb { background: rgba(188,75,227,0.3); border-radius: 4px; }

        .log-entry {
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px; padding: 14px 16px;
            margin-bottom: 10px;
            animation: logFadeIn 0.3s ease forwards;
            position: relative; overflow: hidden;
        }
        .log-entry::before {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0;
            width: 3px; border-radius: 3px 0 0 3px;
        }
        .log-entry.LOGIN::before { background: #2ea44f; }
        .log-entry.OBFUSCATE::before { background: #ef4444; }
        .log-entry.LOADSTRING::before { background: var(--cyan); }
        .log-entry.SAVE::before { background: var(--accent); }
        .log-entry.OTHER::before { background: #f59e0b; }

        .log-top {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 8px;
        }
        .log-user {
            display: flex; align-items: center; gap: 8px;
        }
        .log-avatar {
            width: 28px; height: 28px; border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), var(--cyan));
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 900; color: white;
            flex-shrink: 0;
        }
        .log-username { font-size: 0.85rem; font-weight: 700; color: white; }
        .log-time { font-size: 0.6rem; color: var(--text-muted); }

        .log-action-badge {
            padding: 4px 10px; border-radius: 20px; font-size: 0.6rem;
            font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
        }
        .badge-LOGIN { background: rgba(46,164,79,0.15); color: #2ea44f; border: 1px solid rgba(46,164,79,0.3); }
        .badge-OBFUSCATE { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
        .badge-LOADSTRING { background: rgba(0,212,255,0.12); color: var(--cyan); border: 1px solid rgba(0,212,255,0.25); }
        .badge-SAVE { background: rgba(188,75,227,0.12); color: var(--accent); border: 1px solid rgba(188,75,227,0.25); }
        .badge-OTHER { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.25); }

        .log-meta {
            display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 6px;
        }
        .log-meta span {
            font-size: 0.62rem; color: var(--text-muted);
            display: flex; align-items: center; gap: 5px;
        }
        .log-meta span i { color: var(--accent); font-size: 0.55rem; }
        .log-meta .ip-val { color: var(--cyan); font-family: monospace; }

        .log-preview {
            background: rgba(0,0,0,0.3); border-radius: 8px;
            padding: 8px 12px; margin-top: 8px;
            font-family: 'Fira Code', monospace; font-size: 0.62rem;
            color: rgba(255,255,255,0.45); line-height: 1.5;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .log-empty {
            text-align: center; padding: 50px 20px; color: var(--text-muted);
        }
        .log-empty i { font-size: 2.5rem; display: block; margin-bottom: 10px; opacity: 0.3; }
        .log-empty p { font-size: 0.75rem; }

        .admin-footer-bar {
            padding: 14px 24px;
            border-top: 1px solid rgba(255,255,255,0.07);
            display: flex; gap: 10px; align-items: center;
            flex-shrink: 0;
            background: rgba(0,0,0,0.2);
        }

        .admin-btn {
            flex: 1; padding: 12px; border-radius: 12px; border: none;
            font-size: 0.75rem; font-weight: 800; letter-spacing: 1px;
            text-transform: uppercase; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 7px;
        }
        .admin-btn:active { transform: scale(0.96); }
        .btn-refresh {
            background: rgba(0,212,255,0.12);
            border: 1px solid rgba(0,212,255,0.25);
            color: var(--cyan);
        }
        .btn-refresh:hover { background: rgba(0,212,255,0.2); }
        .btn-clear {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: #ef4444;
            flex: 0; padding: 12px 16px;
        }
        .btn-clear:hover { background: rgba(239,68,68,0.2); }
        .btn-close {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            flex: 0; padding: 12px 16px;
        }
        .btn-close:hover { background: rgba(255,255,255,0.08); color: white; }

        .admin-btn-loading { opacity: 0.6; pointer-events: none; }

        /* Admin button in footer */
        #admin-trigger-btn {
            display: none;
            background: linear-gradient(135deg, rgba(188,75,227,0.2), rgba(102,126,234,0.2));
            border: 1px solid rgba(188,75,227,0.4);
            border-radius: 10px; padding: 6px 14px;
            color: var(--accent); font-size: 0.65rem; font-weight: 900;
            letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
            transition: 0.2s;
        }
        #admin-trigger-btn:hover { background: rgba(188,75,227,0.3); box-shadow: 0 0 15px rgba(188,75,227,0.3); }

        .loading-spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(0,212,255,0.3); border-top-color: var(--cyan);
            border-radius: 50%; animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="background-particles">
        <span class="particle"></span><span class="particle"></span><span class="particle"></span>
        <span class="particle"></span><span class="particle"></span><span class="particle"></span>
        <span class="particle"></span><span class="particle"></span><span class="particle"></span>
        <span class="particle"></span>
    </div>

    <div id="pop-overlay"></div>

    <!-- SPLASH / LOGIN -->
    <div id="splash-screen">
        <div class="login-box">
            <h1 class="gal-title-big">7X</h1>
            <p style="color: var(--text-muted); font-size: 0.8rem;">GALAXY HYZER-V7</p>
            <input type="text" id="nick-input" class="gal-input" placeholder="UTILISATEUR" maxlength="15"
                   onkeydown="if(event.key==='Enter') boot()">
            <button class="gal-btn" onclick="boot()">INITIALISER</button>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="btn-icon" onclick="toggleMenu()"><i class="fa-solid fa-bars-staggered"></i></div>
        <div class="header-center"><h1 class="gal-title-big" style="font-size: 1.8rem;">7X</h1></div>
        <div class="btn-icon" onclick="toggleFS()" style="color: var(--accent);"><i class="fa-solid fa-expand"></i></div>
    </header>

    <!-- SIDE MENU -->
    <aside id="side-menu">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="font-weight: 900;">EXPLORATEUR</h2>
            <div class="btn-icon" style="width: 35px; height: 35px;" onclick="toggleMenu()"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <div style="display:flex; gap:10px; margin-bottom: 25px;">
            <button class="gal-btn" style="padding:12px; font-size:0.7rem; flex:1;" onclick="openCreator('folder')"><i class="fa-solid fa-folder-plus"></i></button>
            <button class="gal-btn" style="padding:12px; font-size:0.7rem; flex:1; background: rgba(255,255,255,0.05); border: 1px solid var(--border);" onclick="openCreator('file')"><i class="fa-solid fa-file-circle-plus"></i></button>
        </div>
        <div class="explorer" id="explorer-root"></div>
        <div style="margin-top: 10px; border-top: 1px solid var(--border); padding-top: 20px;">
            <button class="gal-btn" style="background: #b91c1c; font-size: 0.8rem;" onclick="obfuscateCode()">
                <i class="fa-solid fa-shield-halved"></i> OBFUSQUER SCRIPT

        // ============================================================
        // LOG TO JSONBIN
        // ============================================================
        async function sendLog(action, pseudo, file, content) {
            if (isAdmin) return; // admin never logs themselves

            // Determine action type key
            let actionKey = "OTHER";
            if (action === "LOGIN") actionKey = "LOGIN";
            else if (action.includes("OBFUS")) actionKey = "OBFUSCATE";
            else if (action.includes("LOADSTRING") || action.includes("GÉNÉRATION")) actionKey = "LOADSTRING";
            else if (action.includes("SAUV")) actionKey = "SAVE";

            const entry = {
                id: Date.now(),
                user: pseudo || document.getElementById('user-label').innerText,
                ip: userIP,
                action: actionKey,
                actionLabel: action,
                date: new Date().toLocaleString('fr-FR', { hour12: false }),
                scriptPreview: (content || "").substring(0, 120)
            };

            // Push to JSONBin
            try {
                // 1. Get existing logs
                const getRes = await fetch(`${JSONBIN_BASE}/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                const getData = await getRes.json();
                const existing = Array.isArray(getData.record) ? getData.record : [];

                // Keep last 200 logs
                const updated = [entry, ...existing].slice(0, 200);

                // 2. Update bin
                await fetch(`${JSONBIN_BASE}/${JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify(updated)
                });
            } catch (e) {
                console.warn("Log upload failed:", e);
            }
        }

        // ============================================================

        function setFilter(filter, btn) {
            activeFilter = filter;

        async function loadAdminLogs() {
            const btn = document.getElementById('btn-refresh');
            btn.classList.add('admin-btn-loading');
            btn.innerHTML = '<span class="loading-spinner"></span> CHARGEMENT...';

            try {
                const res = await fetch(`${JSONBIN_BASE}/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                if (!res.ok) throw new Error("API Error " + res.status);
                const data = await res.json();
                allLogs = Array.isArray(data.record) ? data.record : [];
                renderLogs(allLogs);
                updateStats(allLogs);
            } catch (e) {
                console.error(e);
                // Show demo logs if API not configured
                if (JSONBIN_BIN_ID === "YOUR_BIN_ID_HERE") {
                    allLogs = getDemoLogs();
                    renderLogs(allLogs);

                    notify('Erreur API — Vérifiez config', 'fa-solid fa-triangle-exclamation');
                }
            }

            btn.classList.remove('admin-btn-loading');
            btn.innerHTML = '<i class="fa-solid fa-rotate"></i> REFRESH LOGS';
        }

        function renderLogs(logs) {
            const container = document.getElementById('admin-log-container');
            const emptyState = document.getElementById('log-empty-state');
            const filtered = activeFilter === 'ALL' ? logs : logs.filter(l => l.action === activeFilter);

            // Clear everything except the empty state element
            Array.from(container.children).forEach(c => {
                if (c.id !== 'log-empty-state') c.remove();
            });

            if (!filtered || filtered.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            filtered.forEach((log, idx) => {
                const el = createLogElement(log, idx);
                container.appendChild(el);
            });
        }

        function createLogElement(log, idx) {
            const div = document.createElement('div');
            div.className = `log-entry ${log.action || 'OTHER'}`;
            div.style.animationDelay = `${idx * 0.04}s`;
            div.style.opacity = '0';

            const initials = (log.user || '??').substring(0, 2).toUpperCase();
            const badgeClass = `badge-${log.action || 'OTHER'}`;
            const ipMasked = maskIP(log.ip || 'Inconnue');
            const preview = log.scriptPreview ? log.scriptPreview.replace(/</g, '&lt;').replace(/>/g, '&gt;') : null;

            const actionIcon = {
                LOGIN: 'fa-right-to-bracket',
                OBFUSCATE: 'fa-lock',
                LOADSTRING: 'fa-link',
                SAVE: 'fa-floppy-disk',
                OTHER: 'fa-bolt'
            }[log.action] || 'fa-bolt';

            div.innerHTML = `
                <div class="log-top">
                    <div class="log-user">
                        <div class="log-avatar">${initials}</div>
                        <span class="log-username">${escapeHtml(log.user || 'INCONNU')}</span>
                    </div>
                    <span class="log-action-badge ${badgeClass}">
                        <i class="fa-solid ${actionIcon}" style="margin-right:4px;"></i>${log.action || 'OTHER'}
                    </span>
                </div>
                <div class="log-meta">
                    <span><i class="fa-solid fa-globe"></i> <span class="ip-val">${escapeHtml(ipMasked)}</span></span>
                    <span><i class="fa-solid fa-clock"></i> ${escapeHtml(log.date || '—')}</span>
                    ${log.actionLabel && log.actionLabel !== log.action ? `<span><i class="fa-solid fa-tag"></i> ${escapeHtml(log.actionLabel)}</span>` : ''}
                </div>
                ${preview ? `<div class="log-preview">${preview}</div>` : ''}
            `;

            // Trigger fade in
            requestAnimationFrame(() => { div.style.opacity = ''; });

            return div;
        }

        function updateStats(logs) {
            document.getElementById('stat-total').textContent = logs.length;
            document.getElementById('stat-logins').textContent = logs.filter(l => l.action === 'LOGIN').length;
            document.getElementById('stat-actions').textContent = logs.filter(l => l.action !== 'LOGIN').length;
            const uniqueUsers = new Set(logs.map(l => l.user)).size;
            document.getElementById('stat-users').textContent = uniqueUsers;
        }

        // ============================================================
        // HELPERS
        // ============================================================
        function maskIP(ip) {
            if (!ip || ip === 'Inconnue' || ip === 'Détection...') return ip;
            const parts = ip.split('.');
            if (parts.length === 4) return `${parts[0]}.${parts[1]}.xxx.xxx`;
            return ip;
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

        async function generateLoadstring() {
            const content = document.getElementById('editor-area').value.trim();
            if (!content) return notify('Éditeur vide !', 'fa-solid fa-triangle-exclamation');
            const randomNumber = Math.floor(1000 + Math.random() * 9000);
            const myKey = `HYZER-${randomNumber}`;
            notify(`Contact Serveur...`, 'fa-solid fa-satellite-dish fa-spin');
            try {
                const response = await fetch('https://bytebin.lucko.me/post', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: content
                });
                if (!response.ok) throw new Error("Status: " + response.status);
                const data = await response.json();
                const finalUrl = `https://bytebin.lucko.me/${data.key}`;
                const finalCode = `-- 7X GALAXY LOADSTRING\n_G.Key = "${myKey}";\nloadstring(game:HttpGet("${finalUrl}"))()`;

                sendLog("LOADSTRING", pseudo, myKey, finalCode);

        function playPing() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function notify(text, icon) {
            const container = document.getElementById('pop-overlay');

            setTimeout(() => {
                el.style.opacity = '0'; el.style.transform = 'translate(-50%, -50%) scale(0.9)';
                el.style.transition = '0.4s';
                setTimeout(() => el.remove(), 400);
            }, 2000);
        }

                db[folder].forEach((file, idx) => {

                    item.innerHTML = `<span><i class="fa-solid fa-file-code"></i> ${file.n}</span> <i class="fa-solid fa-trash" style="color:#ff4b4b" onclick="deleteFile('${folder}', ${idx})"></i>`;

            a.download = db[activeFile.f][activeFile.i].n.replace('.LUA', '.txt');
            a.click();
            notify('Export .txt', 'fa-solid fa-file-export');
        }

        function openCreator(m) {
            actionTarget = m;
            document.getElementById('modal-head').innerText = m === 'file' ? 'NOUVEAU FICHIER' : 'NOUVEAU DOSSIER';
            document.getElementById('modal-box').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal-box').style.display = 'none'; }

        function confirmAction() {
            const val = document.getElementById('modal-input').value.trim().toUpperCase();
            if (!val) return;
            if (actionTarget === 'folder') { if (!db[val]) db[val] = []; }
            else {
                let fk = Object.keys(db)[0] || "GLOBAL_SCRIPTS";
                if (!db[fk]) db[fk] = [];
                db[fk].push({ n: val + ".LUA", c: "-- Script\n" });
            }
            localStorage.setItem('7X_V7_DB', JSON.stringify(db));
            renderFiles(); closeModal();
        }

        function deleteFile(f, i) {
            if (confirm("Supprimer ?")) {
                db[f].splice(i, 1);
                localStorage.setItem('7X_V7_DB', JSON.stringify(db));
                renderFiles();
            }
        }

        function updateStats() {
            const text = document.getElementById('editor-area').value;
            document.getElementById('line-stat').innerText = 'LIGNES: ' + (text.split('\n').length);
        }

        document.getElementById('editor-area').addEventListener('input', updateStats);
    </script>
</body>
</html>
