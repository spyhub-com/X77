<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Axtra Credits</title>
<style>
body {
    background: #0f0f0f;
    color: #00ffff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin:0;
}
.container {
    text-align: center;
    background: #111;
    padding: 30px 50px;
    border-radius: 15px;
    box-shadow: 0 0 20px #00ffff;
}
.btn {
    display: inline-block;
    padding: 10px 20px;
    background: #00ffff;
    color: #000;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    margin-top: 20px;
}
.hidden { display: none; }
button {
    padding: 10px 20px;
    background: #111;
    border: 2px solid #00ffff;
    border-radius: 8px;
    color: #00ffff;
    cursor: pointer;
    margin-top: 20px;
}
</style>
</head>
<body>
<div class="container">
    <h1>Axtra Credits</h1>
    <div id="login">
        <a href="#" class="btn" id="loginBtn">Connexion avec Discord</a>
    </div>
    <div id="credits" class="hidden">
        <p>Salut <span id="username"></span> !</p>
        <p>Crédits actuels : <span id="credit-count">0</span></p>
        <p id="message"></p>
        <button id="getCreditsBtn">Récupérer 10 crédits</button>
        <button id="logout">Se déconnecter</button>
    </div>
</div>

<script>
// Simulé pour front-end autonome (sans backend)
let user = null;

const loginDiv = document.getElementById("login");
const creditsDiv = document.getElementById("credits");
const usernameEl = document.getElementById("username");
const creditCountEl = document.getElementById("credit-count");
const messageEl = document.getElementById("message");
const logoutBtn = document.getElementById("logout");
const getCreditsBtn = document.getElementById("getCreditsBtn");
const loginBtn = document.getElementById("loginBtn");

function updateUI() {
    if(user){
        loginDiv.classList.add("hidden");
        creditsDiv.classList.remove("hidden");
        usernameEl.textContent = user.username;
        creditCountEl.textContent = user.credits;
        messageEl.textContent = user.message;
    } else {
        loginDiv.classList.remove("hidden");
        creditsDiv.classList.add("hidden");
    }
}

// Simule connexion Discord
loginBtn.onclick = () => {
    user = { username: "Shadow123", credits: 0, lastReset: 0, message: "Bienvenue !" };
    updateUI();
};

// Récupérer 10 crédits toutes les 24h
getCreditsBtn.onclick = () => {
    const now = Date.now();
    if(!user.lastReset || now - user.lastReset >= 24*60*60*1000){
        user.credits += 10;
        user.lastReset = now;
        user.message = "✅ Vous avez récupéré vos 10 crédits !";
    } else {
        const remaining = 24*60*60*1000 - (now - user.lastReset);
        const hours = Math.floor(remaining/(1000*60*60));
        const minutes = Math.floor((remaining%(1000*60*60))/(1000*60));
        user.message = `⏳ Vous devez attendre ${hours}h ${minutes}m avant de récupérer vos crédits.`;
    }
    updateUI();
};

// Déconnexion
logoutBtn.onclick = () => { user = null; updateUI(); };

updateUI();
</script>
</body>
</html>
