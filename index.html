<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discord Widget API</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080a0f;
      --surface: #0f1117;
      --card: #13161e;
      --border: #1e2230;
      --accent: #5865f2;
      --green: #23a55a;
      --yellow: #f0b232;
      --red: #f23f42;
      --text: #dde1f0;
      --muted: #4a5068;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      font-family: var(--mono);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 24px;
    }

    /* Subtle grid bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(88,101,242,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(88,101,242,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Glow top */
    body::after {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(88,101,242,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeDown 0.5s ease both;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .top-bar svg { width: 28px; height: 28px; }

    .title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .title span { color: var(--accent); }

    /* Status badge */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
    }
    .dot.loading { background: var(--yellow); animation: blink 1s infinite; }
    .dot.error   { background: var(--red); }

    @keyframes blink {
      0%,100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    /* Server card */
    .server-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      overflow: hidden;
      animation: fadeUp 0.6s ease 0.1s both;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .server-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(88,101,242,0.07), transparent);
    }

    .server-icon {
      width: 52px; height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
    }

    .server-icon-placeholder {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .server-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .server-id {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .stats-row {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
    }

    .stat {
      flex: 1;
      text-align: center;
      padding: 14px 10px;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: none; }

    .stat-value {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 2px;
    }

    /* Members */
    .section-title {
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 14px 20px 8px;
    }

    .members-list {
      padding: 0 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 280px;
      overflow-y: auto;
    }

    .members-list::-webkit-scrollbar { width: 4px; }
    .members-list::-webkit-scrollbar-track { background: transparent; }
    .members-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .member {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      transition: background 0.15s;
      animation: slideIn 0.3s ease both;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .member:hover { background: rgba(255,255,255,0.03); }

    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface);
    }

    .status-dot {
      position: absolute;
      bottom: 0; right: 0;
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 2px solid var(--card);
    }
    .status-dot.online  { background: var(--green); }
    .status-dot.idle    { background: var(--yellow); }
    .status-dot.dnd     { background: var(--red); }
    .status-dot.offline { background: var(--muted); }

    .member-info { flex: 1; min-width: 0; }

    .member-name {
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .member-activity {
      font-size: 0.68rem;
      color: var(--muted);
      white-space: nowrap;
