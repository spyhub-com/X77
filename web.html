<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIRTUAL SERVEUR LUA | 7X</title>
    <style>
        :root {
            --bg-base: #0a0a0c;
            --bg-panel: #121216;
            --bg-hover: #1c1c22;
            --border-color: #2a2a35;
            --text-main: #e0e0e0;
            --text-muted: #6c6c80;
            --accent-blue: #00e5ff;
            --accent-blue-dim: rgba(0, 229, 255, 0.2);
            --code-green: #39ff14;
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --transition-speed: 0.2s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            z-index: 1000;
        }

        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 3rem;
            border-radius: 4px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            width: 90%;
            max-width: 500px;
        }

        .small-modal {
            padding: 2rem;
            max-width: 400px;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .accent {
            color: var(--accent-blue);
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        input[type="text"] {
            width: 100%;
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 1.1rem;
            outline: none;
            margin-bottom: 1.5rem;
            transition: border-color var(--transition-speed);
        }

        input[type="text"]:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px var(--accent-blue-dim);
        }

        button {
            cursor: pointer;
            font-family: var(--font-sans);
            font-weight: 600;
            letter-spacing: 1px;
            border: none;
            outline: none;
            transition: all var(--transition-speed);
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: var(--bg-base);
            padding: 1rem 2rem;
            width: 100%;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background-color: #00b3cc;
            box-shadow: 0 0 15px var(--accent-blue-dim);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.8rem 1.5rem;
        }

        .btn-outline:hover {
            border-color: var(--text-main);
            background-color: var(--bg-hover);
        }

        .btn-small {
            padding: 0.5rem 1rem;
            width: auto;
            font-size: 0.85rem;
        }

        .btn-massive {
            display: block;
            width: 100%;
            padding: 1.5rem;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            background-color: var(--bg-panel);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }

        .btn-massive:hover {
            background-color: var(--accent-blue-dim);
        }

        .btn-alt {
            color: var(--code-green);
            border-color: var(--code-green);
        }

        .btn-alt:hover {
            background-color: rgba(57, 255, 20, 0.1);
        }

        #app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        #sidebar {
            width: 300px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 1.5rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
            color: var(--accent-blue);
            font-size: 0.9rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--code-green);
            box-shadow: 0 0 8px var(--code-green);
        }

        .sidebar-actions {
            display: flex;
            gap: 5px;
        }

        .icon-btn {
            background: transparent;
            color: var(--text-muted);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .icon-btn:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }

        .tree-item {
            list-style: none;
        }

        .tree-row {
            display: flex;
            align-items: center;
            padding: 0.4rem 1rem;
            cursor: pointer;
            user-select: none;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .tree-row:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        .tree-row.active {
            background-color: var(--accent-blue-dim);
            color: var(--accent-blue);
            border-right: 3px solid var(--accent-blue);
        }

        .tree-icon {
            margin-right: 10px;
            font-size: 1.1rem;
        }

        .folder-children {
            padding-left: 1.5rem;
        }

        #workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-base);
        }

        .workspace-header {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            background-color: var(--bg-base);
        }

        .path-display {
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .content-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #code-editor {
            width: 100%;
            height: 100%;
            background-color: transparent;
            border: none;
            padding: 2rem;
            color: var(--code-green);
            font-family: var(--font-mono);
            font-size: 1.1rem;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        #code-viewer {
            width: 100%;
            height: 100%;
            padding: 2rem;
            color: var(--code-green);
            font-family: var(--font-mono);
            font-size: 1.1rem;
            line-height: 1.5;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(10, 10, 12, 0.9);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
        }

        .hidden-pc {
            display: none;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        @media (max-width: 768px) {
            #sidebar {
                display: none;
            }
            .hidden-pc {
                display: block;
            }
            .workspace-header {
                padding: 0 1rem;
            }
            #code-editor, #code-viewer {
                padding: 1rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="auth-screen" class="fullscreen-overlay flex-center">
        <div class="modal-box">
            <h1>VIRTUAL SERVEUR LUA | <span class="accent">7X</span></h1>
            <p>IDENTIFICATION REQUISE</p>
            <input type="text" id="pseudo-input" placeholder="Entrez votre pseudo..." autocomplete="off" spellcheck="false">
            <button id="btn-login" class="btn-primary">CONNEXION</button>
        </div>
    </div>

    <div id="mobile-home" class="fullscreen-overlay flex-center hidden">
        <div class="mobile-menu-box">
            <h2 id="mobile-welcome"></h2>
            <p>SÉLECTIONNEZ UN MODE</p>
            <button id="btn-mode-code" class="btn-massive">MODE CODAGE</button>
            <button id="btn-mode-view" class="btn-massive btn-alt">MODE VISIONNEUSE</button>
        </div>
    </div>

    <div id="app-container" class="hidden">
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <span class="status-dot"></span>
                    <span id="user-display"></span>
                </div>
                <div class="sidebar-actions">
                    <button id="btn-new-file" class="icon-btn" title="Nouveau Fichier Lua">+F</button>
                    <button id="btn-new-folder" class="icon-btn" title="Nouveau Dossier">+D</button>
                </div>
            </div>
            <div id="file-tree" class="file-tree"></div>
        </aside>

        <main id="workspace">
            <header class="workspace-header">
                <div class="mobile-nav hidden-pc">
                    <button id="btn-back-menu" class="btn-outline">< RETOUR</button>
                </div>
                <div id="active-file-path" class="path-display">/root</div>
                <button id="btn-save" class="btn-primary btn-small">SAUVEGARDER</button>
            </header>
            
            <div id="editor-wrapper" class="content-wrapper">
                <textarea id="code-editor" spellcheck="false" autocomplete="off" placeholder="-- Saisissez votre code Lua ici..."></textarea>
            </div>
            
            <div id="viewer-wrapper" class="content-wrapper hidden">
                <pre id="code-viewer"><code></code></pre>
            </div>
        </main>
    </div>

    <div id="prompt-modal" class="modal-overlay hidden">
        <div class="modal-box small-modal">
            <h3 id="prompt-title"></h3>
            <input type="text" id="prompt-input" autocomplete="off" spellcheck="false">
            <div class="modal-actions">
                <button id="btn-prompt-cancel" class="btn-outline">ANNULER</button>
                <button id="btn-prompt-confirm" class="btn-primary">VALIDER</button>
            </div>
        </div>
    </div>

    <script>
        const DOM = {
            authScreen: document.getElementById('auth-screen'),
            pseudoInput: document.getElementById('pseudo-input'),
            btnLogin: document.getElementById('btn-login'),
            mobileHome: document.getElementById('mobile-home'),
            mobileWelcome: document.getElementById('mobile-welcome'),
            btnModeCode: document.getElementById('btn-mode-code'),
            btnModeView: document.getElementById('btn-mode-view'),
            appContainer: document.getElementById('app-container'),
            userDisplay: document.getElementById('user-display'),
            fileTree: document.getElementById('file-tree'),
            btnNewFile: document.getElementById('btn-new-file'),
            btnNewFolder: document.getElementById('btn-new-folder'),
            activeFilePath: document.getElementById('active-file-path'),
            btnSave: document.getElementById('btn-save'),
            editorWrapper: document.getElementById('editor-wrapper'),
            viewerWrapper: document.getElementById('viewer-wrapper'),
            codeEditor: document.getElementById('code-editor'),
            codeViewer: document.querySelector('#code-viewer code'),
            btnBackMenu: document.getElementById('btn-back-menu'),
            promptModal: document.getElementById('prompt-modal'),
            promptTitle: document.getElementById('prompt-title'),
            promptInput: document.getElementById('prompt-input'),
            btnPromptConfirm: document.getElementById('btn-prompt-confirm'),
            btnPromptCancel: document.getElementById('btn-prompt-cancel'),
            sidebar: document.getElementById('sidebar')
        };

        const State = {
            user: null,
            vfs: {},
            activeFileId: null,
            activeFolderId: 'root',
            mode: 'desktop',
            isMobile: window.innerWidth <= 768,
            promptCallback: null
        };

        function generateId() {
            return 'id_' + Math.random().toString(36).substr(2, 9);
        }

        function saveState() {
            if (!State.user) return;
            const dataToSave = {
                vfs: State.vfs,
                activeFileId: State.activeFileId
            };
            localStorage.setItem(`lua_env_${State.user}`, JSON.stringify(dataToSave));
        }

        function loadState() {
            const data = localStorage.getItem(`lua_env_${State.user}`);
            if (data) {
                const parsed = JSON.parse(data);
                State.vfs = parsed.vfs || {};
                State.activeFileId = parsed.activeFileId || null;
            } else {
                State.vfs = {
                    'root': { id: 'root', type: 'folder', name: 'root', parentId: null },
                    'demo_file': { id: 'demo_file', type: 'file', name: 'main.lua', parentId: 'root', content: '-- Bienvenue sur 7X\nprint("Connexion établie.")' }
                };
                State.activeFileId = 'demo_file';
            }
        }

        function initApp() {
            const storedUser = localStorage.getItem('lua_env_currentUser');
            if (storedUser) {
                State.user = storedUser;
                bootstrapWorkspace();
            } else {
                DOM.authScreen.classList.remove('hidden');
                DOM.pseudoInput.focus();
            }
            setupEventListeners();
            window.addEventListener('resize', handleResize);
        }

        function handleLogin() {
            const pseudo = DOM.pseudoInput.value.trim();
            if (pseudo.length < 2) return;
            State.user = pseudo;
            localStorage.setItem('lua_env_currentUser', pseudo);
            bootstrapWorkspace();
        }

        function bootstrapWorkspace() {
            DOM.authScreen.classList.add('hidden');
            loadState();
            DOM.userDisplay.textContent = `Salut ${State.user}`;
            
            if (State.isMobile) {
                DOM.mobileWelcome.textContent = `Salut ${State.user}`;
                DOM.mobileHome.classList.remove('hidden');
            } else {
                startDesktopMode();
            }
        }

        function startDesktopMode() {
            DOM.mobileHome.classList.add('hidden');
            DOM.appContainer.classList.remove('hidden');
            State.mode = 'desktop';
            renderFileTree();
            if (State.activeFileId && State.vfs[State.activeFileId]) {
                openFile(State.activeFileId);
            } else {
                clearWorkspace();
            }
        }

        function startMobileMode(type) {
            DOM.mobileHome.classList.add('hidden');
            DOM.appContainer.classList.remove('hidden');
            DOM.sidebar.style.display = 'none';
            State.mode = type;
            
            if (type === 'view') {
                DOM.editorWrapper.classList.add('hidden');
                DOM.viewerWrapper.classList.remove('hidden');
                DOM.btnSave.classList.add('hidden');
            } else {
                DOM.viewerWrapper.classList.add('hidden');
                DOM.editorWrapper.classList.remove('hidden');
                DOM.btnSave.classList.remove('hidden');
            }
            
            if (State.activeFileId && State.vfs[State.activeFileId]) {
                openFile(State.activeFileId);
            } else {
                clearWorkspace();
            }
        }

        function handleResize() {
            const currentlyMobile = window.innerWidth <= 768;
            if (currentlyMobile !== State.isMobile) {
                State.isMobile = currentlyMobile;
                if (!State.isMobile) {
                    DOM.sidebar.style.display = 'flex';
                    startDesktopMode();
                } else {
                    DOM.appContainer.classList.add('hidden');
                    DOM.mobileHome.classList.remove('hidden');
                }
            }
        }

        function renderFileTree() {
            DOM.fileTree.innerHTML = '';
            const rootUl = document.createElement('ul');
            rootUl.className = 'tree-item';
            buildTreeNodes('root', rootUl);
            DOM.fileTree.appendChild(rootUl);
        }

        function buildTreeNodes(parentId, containerElement) {
            const items = Object.values(State.vfs).filter(item => item.parentId === parentId && item.id !== 'root');
            
            items.sort((a, b) => {
                if (a.type === b.type) return a.name.localeCompare(b.name);
                return a.type === 'folder' ? -1 : 1;
            });

            items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'tree-item';
                
                const row = document.createElement('div');
                row.className = 'tree-row';
                if (item.id === State.activeFileId || item.id === State.activeFolderId) {
                    row.classList.add('active');
                }

                const icon = document.createElement('span');
                icon.className = 'tree-icon';
                icon.textContent = item.type === 'folder' ? '📁' : '📄';

                const nameSpan = document.createElement('span');
                nameSpan.textContent = item.name;

                row.appendChild(icon);
                row.appendChild(nameSpan);
                
                row.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (item.type === 'folder') {
                        State.activeFolderId = item.id;
                        renderFileTree();
                    } else {
                        openFile(item.id);
                    }
                });

                li.appendChild(row);

                if (item.type === 'folder') {
                    const childrenContainer = document.createElement('ul');
                    childrenContainer.className = 'folder-children';
                    buildTreeNodes(item.id, childrenContainer);
                    li.appendChild(childrenContainer);
                }

                containerElement.appendChild(li);
            });
        }

        function openFile(fileId) {
            const file = State.vfs[fileId];
            if (!file) return;

            State.activeFileId = fileId;
            State.activeFolderId = file.parentId;
            
            let pathStr = file.name;
            let currParent = State.vfs[file.parentId];
            while (currParent && currParent.id !== 'root') {
                pathStr = currParent.name + '/' + pathStr;
                currParent = State.vfs[currParent.parentId];
            }
            DOM.activeFilePath.textContent = '/root/' + pathStr;

            DOM.codeEditor.value = file.content || '';
            DOM.codeViewer.textContent = file.content || '';

            if (!State.isMobile) renderFileTree();
            saveState();
        }

        function clearWorkspace() {
            DOM.activeFilePath.textContent = '/root';
            DOM.codeEditor.value = '';
            DOM.codeViewer.textContent = '';
            State.activeFileId = null;
        }

        function saveCurrentFile() {
            if (!State.activeFileId) return;
            const content = DOM.codeEditor.value;
            State.vfs[State.activeFileId].content = content;
            DOM.codeViewer.textContent = content;
            saveState();
            
            const originalText = DOM.btnSave.textContent;
            DOM.btnSave.textContent = 'SAUVEGARDÉ ✓';
            DOM.btnSave.style.backgroundColor = 'var(--code-green)';
            DOM.btnSave.style.color = '#000';
            setTimeout(() => {
                DOM.btnSave.textContent = originalText;
                DOM.btnSave.style.backgroundColor = '';
                DOM.btnSave.style.color = '';
            }, 1500);
        }

        function showPrompt(title, callback) {
            DOM.promptTitle.textContent = title;
            DOM.promptInput.value = '';
            State.promptCallback = callback;
            DOM.promptModal.classList.remove('hidden');
            DOM.promptInput.focus();
        }

        function hidePrompt() {
            DOM.promptModal.classList.add('hidden');
            State.promptCallback = null;
        }

        function handlePromptConfirm() {
            const val = DOM.promptInput.value.trim();
            if (val && State.promptCallback) {
                State.promptCallback(val);
            }
            hidePrompt();
        }

        function createNewEntity(type) {
            const extension = type === 'file' ? '.lua' : '';
            showPrompt(`Nom du nouveau ${type === 'folder' ? 'dossier' : 'fichier'} :`, (name) => {
                let finalName = name;
                if (type === 'file' && (!finalName.endsWith('.lua'))) {
                    finalName += '.lua';
                }
                
                const newId = generateId();
                const targetParentId = State.activeFolderId || 'root';
                
                State.vfs[newId] = {
                    id: newId,
                    type: type,
                    name: finalName,
                    parentId: targetParentId,
                    content: type === 'file' ? '' : null
                };
                
                saveState();
                renderFileTree();
                if (type === 'file') openFile(newId);
            });
        }

        function setupEventListeners() {
            DOM.btnLogin.addEventListener('click', handleLogin);
            DOM.pseudoInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });

            DOM.btnModeCode.addEventListener('click', () => startMobileMode('code'));
            DOM.btnModeView.addEventListener('click', () => startMobileMode('view'));

            DOM.btnBackMenu.addEventListener('click', () => {
                DOM.appContainer.classList.add('hidden');
                DOM.mobileHome.classList.remove('hidden');
            });

            DOM.btnNewFile.addEventListener('click', () => createNewEntity('file'));
            DOM.btnNewFolder.addEventListener('click', () => createNewEntity('folder'));

            DOM.btnSave.addEventListener('click', saveCurrentFile);
            
            DOM.codeEditor.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    saveCurrentFile();
                }
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = DOM.codeEditor.selectionStart;
                    const end = DOM.codeEditor.selectionEnd;
                    DOM.codeEditor.value = DOM.codeEditor.value.substring(0, start) + "    " + DOM.codeEditor.value.substring(end);
                    DOM.codeEditor.selectionStart = DOM.codeEditor.selectionEnd = start + 4;
                }
            });

            DOM.btnPromptCancel.addEventListener('click', hidePrompt);
            DOM.btnPromptConfirm.addEventListener('click', handlePromptConfirm);
            DOM.promptInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handlePromptConfirm();
            });
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !DOM.promptModal.classList.contains('hidden')) {
                    hidePrompt();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
