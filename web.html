<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7X STUDIO | GALAXY V6 PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #050508;
            --bg-panel: #0d0d16;
            --accent: #bc4be3;
            --accent-light: #764ba2;
            --cyan: #00d4ff;
            --text: #f5f5f7;
            --text-muted: #86868b;
            --border: rgba(255, 255, 255, 0.08);
            --grad-gal: linear-gradient(135deg, #050508 0%, #11112b 100%);
            --grad-btn: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        @keyframes popDown {
            0% { transform: translate(-50%, -100%); opacity: 0; }
            100% { transform: translate(-50%, 20px); opacity: 1; }
        }

        @keyframes bgFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulseNeon {
            0% { box-shadow: 0 0 5px var(--cyan); }
            50% { box-shadow: 0 0 15px var(--cyan); }
            100% { box-shadow: 0 0 5px var(--cyan); }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--grad-gal);
            background-size: 300% 300%;
            animation: bgFlow 15s infinite ease;
            color: var(--text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .login-box {
            width: 88%;
            max-width: 380px;
            padding: 40px 30px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .gal-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(to right, var(--cyan), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .gal-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            margin: 25px 0 15px;
            text-align: center;
            transition: 0.3s;
        }

        .gal-input:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.5);
        }

        .gal-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            background: var(--grad-btn);
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gal-btn:active {
            transform: scale(0.96);
        }

        header {
            height: 65px;
            background: rgba(13, 13, 22, 0.8);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .btn-icon {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cyan);
            font-size: 1.2rem;
        }

        .v-stat {
            background: rgba(0, 212, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--cyan);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .dot-live {
            width: 6px;
            height: 6px;
            background: var(--cyan);
            border-radius: 50%;
            animation: pulseNeon 1.5s infinite;
        }

        #side-menu {
            position: fixed;
            top: 0;
            left: -100%;
            width: 82%;
            height: 100%;
            background: #080810;
            z-index: 1000;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 30px 20px;
            border-right: 1px solid var(--border);
        }

        #side-menu.active {
            left: 0;
            box-shadow: 20px 0 60px rgba(0,0,0,0.8);
        }

        .search-container {
            margin: 25px 0;
            position: relative;
        }

        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
        }

        .explorer {
            flex: 1;
            overflow-y: auto;
            max-height: 60vh;
        }

        .folder-title {
            font-size: 0.65rem;
            font-weight: 900;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-item {
            padding: 14px 16px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            border: 1px solid transparent;
        }

        .file-item.active {
            background: rgba(188, 75, 227, 0.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        .file-item i.fa-trash-can {
            color: #ff4b4b;
            font-size: 1rem;
            padding: 5px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .action-bar {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        #file-name-display {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-mini {
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 800;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: white;
            text-transform: uppercase;
        }

        .btn-save {
            background: var(--accent);
            border: none;
        }

        #editor-area {
            flex: 1;
            width: 100%;
            background: transparent;
            color: #d4d4d8;
            padding: 25px;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 14px;
            line-height: 1.6;
            border: none;
            outline: none;
            resize: none;
        }

        .status-footer {
            height: 40px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        #pop-container {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            z-index: 10001;
            pointer-events: none;
        }

        .pop-msg {
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 16px 20px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 0.85rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            margin-bottom: 10px;
            animation: popDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            pointer-events: auto;
        }

        .pop-msg i {
            font-size: 1.1rem;
            color: var(--accent);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 5000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal-card {
            width: 85%;
            background: var(--bg-panel);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border);
            text-align: center;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="pop-container"></div>

    <div id="splash-screen">
        <div class="login-box">
            <h1 class="gal-title">7X STUDIO</h1>
            <p style="color: var(--text-muted); font-size: 0.8rem; letter-spacing: 1px;">SYSTEM CLOUD V6</p>
            <input type="text" id="nick-input" class="gal-input" placeholder="NOM D'UTILISATEUR" maxlength="15">
            <button class="gal-btn" onclick="boot()">INITIALISER L'INTERFACE</button>
        </div>
    </div>

    <header>
        <div class="btn-icon" onclick="toggleMenu()">
            <i class="fa-solid fa-bars-staggered"></i>
        </div>
        <div class="gal-title" style="font-size: 1.2rem; margin:0;">7X</div>
        <div class="v-stat">
            <div class="dot-live"></div>
            <span id="vis-display">1 VISITE</span>
        </div>
    </header>

    <aside id="side-menu">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-weight: 900; font-size: 1.4rem;">MENU</h2>
            <div class="btn-icon" style="width: 35px; height: 35px;" onclick="toggleMenu()">
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="file-search" class="search-input" placeholder="Rechercher..." oninput="renderFiles()">
        </div>
        
        <div style="display:flex; gap:10px; margin-bottom: 20px;">
            <button class="gal-btn" style="padding:12px; font-size:0.7rem;" onclick="openCreator('folder')">
                <i class="fa-solid fa-folder-plus"></i> DOSSIER
            </button>
            <button class="gal-btn" style="padding:12px; font-size:0.7rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); box-shadow:none;" onclick="openCreator('file')">
                <i class="fa-solid fa-file-circle-plus"></i> FICHIER
            </button>
        </div>

        <div class="explorer" id="explorer-root"></div>
    </aside>

    <main>
        <div class="action-bar">
            <div id="file-name-display">
                <i class="fa-solid fa-code"></i> AUCUN FICHIER
            </div>
            <div class="btn-group">
                <button class="btn-mini" onclick="exportData()">
                    <i class="fa-solid fa-download"></i>
                </button>
                <button class="btn-mini btn-save" onclick="saveActiveFile()">
                    <i class="fa-solid fa-floppy-disk"></i> SAUVER
                </button>
            </div>
        </div>

        <textarea id="editor-area" spellcheck="false" placeholder="-- Prêt à coder ? Ouvrez un fichier via le menu."></textarea>

        <div class="status-footer">
            <div id="line-stat">LIGNES: 0</div>
            <div id="char-stat">CARACTÈRES: 0</div>
            <div id="user-label" style="color:var(--cyan)">SANS NOM</div>
        </div>
    </main>

    <div class="modal-overlay" id="modal-box">
        <div class="modal-card">
            <h3 id="modal-head">NOUVEL ÉLÉMENT</h3>
            <input type="text" id="modal-input" class="gal-input" placeholder="NOM DE L'ÉLÉMENT">
            <div style="display:flex; gap:10px;">
                <button class="gal-btn" style="background:rgba(255,255,255,0.05); flex:1;" onclick="closeModal()">ANNULER</button>
                <button class="gal-btn" style="flex:1;" onclick="confirmAction()">CRÉER</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('7X_V6_STORAGE')) || {
            "CORE": [{ n: "INIT.LUA", c: "print('7X Studio Mobile Active')\n-- Version 6.0" }],
            "SCRIPTS": []
        };
        let activeFile = null;
        let actionTarget = '';
        let audioCtx = null;

        function playPing() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function notify(text, iconClass) {
            const container = document.getElementById('pop-container');
            const el = document.createElement('div');
            el.className = 'pop-msg';
            el.innerHTML = `<i class="${iconClass}"></i> ${text}`;
            container.appendChild(el);
            playPing();
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translate(-50%, -20px)';
                setTimeout(() => el.remove(), 400);
            }, 2500);
        }

        function updateVisits() {
            let v = parseInt(localStorage.getItem('7X_V6_VISITS')) || 0;
            v++;
            localStorage.setItem('7X_V6_VISITS', v);
            document.getElementById('vis-display').innerText = v + (v > 1 ? ' VISITES' : ' VISITE');
        }

        function boot() {
            const nick = document.getElementById('nick-input').value.trim();
            if(!nick) return;
            document.getElementById('user-label').innerText = nick.toUpperCase();
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => { document.getElementById('splash-screen').style.visibility = 'hidden'; }, 500);
            updateVisits();
            renderFiles();
            notify('Système Galaxy V6 Connecté', 'fa-solid fa-satellite-dish');
        }

        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('active');
        }

        function renderFiles() {
            const search = document.getElementById('file-search').value.toLowerCase();
            const root = document.getElementById('explorer-root');
            root.innerHTML = '';

            for (let folder in db) {
                const head = document.createElement('div');
                head.className = 'folder-title';
                head.innerHTML = `<i class="fa-solid fa-folder-open"></i> ${folder}`;
                root.appendChild(head);

                db[folder].forEach((file, idx) => {
                    if (file.n.toLowerCase().includes(search)) {
                        const item = document.createElement('div');
                        item.className = `file-item ${activeFile && activeFile.f === folder && activeFile.i === idx ? 'active' : ''}`;
                        item.innerHTML = `
                            <span><i class="fa-solid fa-file-code" style="margin-right:8px; opacity:0.6;"></i>${file.n}</span>
                            <i class="fa-solid fa-trash-can" onclick="deleteFile('${folder}', ${idx})"></i>
                        `;
                        item.onclick = (e) => { if(e.target.tagName !== 'I') openFile(folder, idx); };
                        root.appendChild(item);
                    }
                });
            }
        }

        function openFile(f, i) {
            activeFile = { f, i };
            const file = db[f][i];
            document.getElementById('editor-area').value = file.content || file.c;
            document.getElementById('file-name-display').innerHTML = `<i class="fa-solid fa-file-lines"></i> ${file.n}`;
            toggleMenu();
            updateStats();
            renderFiles();
        }

        function saveActiveFile() {
            if(!activeFile) return notify('Aucun fichier ouvert', 'fa-solid fa-circle-exclamation');
            db[activeFile.f][activeFile.i].c = document.getElementById('editor-area').value;
            localStorage.setItem('7X_V6_STORAGE', JSON.stringify(db));
            notify('Sauvegardé sur le Cloud', 'fa-solid fa-cloud-arrow-up');
        }

        function exportData() {
            if(!activeFile) return;
            const content = document.getElementById('editor-area').value;
            const blob = new Blob([content], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = db[activeFile.f][activeFile.i].n.replace('.LUA', '.txt');
            a.click();
            notify('Exportation terminée', 'fa-solid fa-file-export');
        }

        function openCreator(m) {
            actionTarget = m;
            document.getElementById('modal-head').innerText = m === 'file' ? 'CRÉER FICHIER' : 'CRÉER DOSSIER';
            document.getElementById('modal-box').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal-box').style.display = 'none'; }

        function confirmAction() {
            const val = document.getElementById('modal-input').value.trim().toUpperCase();
            if(!val) return;

            if(actionTarget === 'folder') {
                if(!db[val]) db[val] = [];
            } else {
                let firstKey = Object.keys(db)[0];
                db[firstKey].push({ n: val + ".LUA", c: "-- Nouveau Script\n" });
            }
            
            localStorage.setItem('7X_V6_STORAGE', JSON.stringify(db));
            renderFiles();
            closeModal();
            notify('Élément créé', 'fa-solid fa-circle-check');
        }

        function deleteFile(f, i) {
            if(confirm("Supprimer ce script ?")) {
                db[f].splice(i, 1);
                localStorage.setItem('7X_V6_STORAGE', JSON.stringify(db));
                renderFiles();
                notify('Fichier supprimé', 'fa-solid fa-trash-arrow-up');
            }
        }

        function updateStats() {
            const text = document.getElementById('editor-area').value;
            document.getElementById('char-stat').innerText = 'CARACTÈRES: ' + text.length;
            document.getElementById('line-stat').innerText = 'LIGNES: ' + (text.split('\n').length);
        }

        document.getElementById('editor-area').addEventListener('input', updateStats);
    </script>
</body>
</html>
