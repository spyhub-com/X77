<!DOCTYPE html>
<html lang="FR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7X STUDIO PRO | ULTIMATE CLOUD</title>
    <style>
        /* =========================================
           DESIGN SYSTEM : DEEP CHARCOAL & CRIMSON
           ========================================= */
        :root {
            --primaire: #e53935;
            --primaire-hover: #b71c1c;
            --fond-dark: #0d1117;
            --panneau-dark: #161b22;
            --panneau-leger: #21262d;
            --texte-principal: #c9d1d9;
            --texte-muet: #8b949e;
            --bordure: #30363d;
            --succes: #3fb950;
            --code-bg: #010409;
            --ombre: 0 8px 24px rgba(0,0,0,0.5);
            --police: 'Inter', -apple-system, sans-serif;
            --police-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--police);
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            background: var(--fond-dark);
            color: var(--texte-principal);
            overflow: hidden;
        }

        /* =========================================
           ACCUEIL DARK MINIMALISTE
           ========================================= */
        #welcome-screen {
            position: fixed; inset: 0;
            background: var(--fond-dark);
            z-index: 10000;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .welcome-box {
            width: 90%; max-width: 400px; text-align: center;
            animation: focusIn 1s ease-out;
        }

        @keyframes focusIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .logo-main {
            font-size: 2.8rem; font-weight: 900; letter-spacing: -2px;
            margin-bottom: 5px; color: #fff;
        }
        .logo-main span { color: var(--primaire); }

        .input-stylise {
            width: 100%; padding: 16px; background: var(--panneau-dark);
            border: 1px solid var(--bordure); border-radius: 12px;
            color: #fff; font-size: 1rem; margin-top: 30px;
            text-align: center; outline: none; transition: 0.3s;
        }
        .input-stylise:focus { border-color: var(--primaire); box-shadow: 0 0 0 3px rgba(229, 57, 53, 0.2); }

        .btn-entrer {
            width: 100%; padding: 16px; background: var(--primaire);
            color: #fff; border: none; border-radius: 12px;
            font-weight: 800; margin-top: 15px; cursor: pointer;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-entrer:hover { background: var(--primaire-hover); transform: translateY(-2px); }

        /* =========================================
           HEADER & STATUS ONLINE
           ========================================= */
        header {
            height: 65px; background: var(--panneau-dark);
            border-bottom: 1px solid var(--bordure);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 25px; z-index: 100;
        }

        .status-pill {
            display: flex; align-items: center; gap: 10px;
            background: rgba(63, 185, 80, 0.1);
            padding: 6px 14px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 700; color: var(--succes);
        }

        .dot {
            width: 8px; height: 8px; background: var(--succes);
            border-radius: 50%; display: inline-block;
            box-shadow: 0 0 10px var(--succes);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* =========================================
           MAIN LAYOUT
           ========================================= */
        .app-container { display: flex; height: calc(100% - 65px); }

        #sidebar {
            width: 300px; background: var(--panneau-dark);
            border-right: 1px solid var(--bordure);
            display: flex; flex-direction: column;
        }

        .sidebar-tools { padding: 20px; border-bottom: 1px solid var(--bordure); }
        
        .btn-icon {
            background: var(--panneau-leger); border: 1px solid var(--bordure);
            color: #fff; padding: 10px; border-radius: 8px; cursor: pointer;
            font-size: 0.7rem; font-weight: 700; width: 100%; margin-bottom: 10px;
            transition: 0.2s;
        }
        .btn-icon:hover { border-color: var(--primaire); color: var(--primaire); }

        /* EXPLORATEUR & DRAG N DROP */
        .explorer { flex: 1; overflow-y: auto; padding: 15px; }

        .folder { margin-bottom: 15px; border-radius: 8px; transition: 0.2s; }
        .folder.drag-over { background: rgba(229, 57, 53, 0.1); border: 1px dashed var(--primaire); }

        .folder-header {
            font-size: 0.7rem; font-weight: 800; color: var(--texte-muet);
            text-transform: uppercase; padding: 10px; display: flex;
            justify-content: space-between; align-items: center;
        }

        .file-row {
            padding: 12px 15px; border-radius: 6px; margin-bottom: 2px;
            cursor: grab; display: flex; justify-content: space-between;
            align-items: center; font-size: 0.85rem; color: var(--texte-principal);
            transition: 0.2s; border: 1px solid transparent;
        }
        .file-row:active { cursor: grabbing; }
        .file-row:hover { background: var(--panneau-leger); }
        .file-row.active { background: rgba(229, 57, 53, 0.1); color: var(--primaire); border-color: rgba(229, 57, 53, 0.2); }

        /* =========================================
           EDITOR ZONE
           ========================================= */
        #editor { flex: 1; display: flex; flex-direction: column; background: var(--code-bg); }

        .editor-header {
            padding: 10px 20px; background: var(--panneau-dark);
            border-bottom: 1px solid var(--bordure);
            display: flex; justify-content: space-between; align-items: center;
        }

        .breadcrumb { font-size: 0.8rem; font-weight: 600; color: var(--texte-muet); }
        .breadcrumb span { color: #fff; margin-left: 5px; }

        #code-input {
            flex: 1; width: 100%; padding: 25px; background: transparent;
            border: none; color: #d1d1d1; font-family: var(--police-mono);
            font-size: 14px; line-height: 1.6; resize: none; outline: none;
        }

        .footer-bar {
            height: 30px; background: var(--panneau-dark);
            border-top: 1px solid var(--bordure);
            display: flex; align-items: center; padding: 0 20px;
            font-size: 0.7rem; color: var(--texte-muet); gap: 20px;
        }

        /* =========================================
           MODALES & NOTIFS
           ========================================= */
        .toast-container { position: fixed; bottom: 40px; right: 30px; z-index: 10000; }
        .toast {
            background: var(--panneau-leger); color: #fff; padding: 14px 25px;
            border-radius: 10px; margin-top: 10px; border-left: 4px solid var(--primaire);
            box-shadow: var(--ombre); animation: slide 0.3s ease-out;
        }
        @keyframes slide { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            display: none; justify-content: center; align-items: center; z-index: 5000;
        }
        .modal {
            background: var(--panneau-dark); border: 1px solid var(--bordure);
            padding: 30px; border-radius: 16px; width: 350px;
        }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="welcome-box">
            <div class="logo-main">7X<span>STUDIO</span></div>
            <p style="color: var(--texte-muet)">Gestionnaire Cloud Professionnel</p>
            <input type="text" id="username" class="input-stylise" placeholder="Entrez votre pseudonyme..." maxlength="15">
            <button class="btn-entrer" onclick="launchApp()">Démarrer la session</button>
        </div>
    </div>

    <div class="toast-container" id="notifs"></div>

    <header>
        <div class="logo-main" style="font-size: 1.2rem; margin:0;">7X<span>STUDIO</span></div>
        <div style="display:flex; gap:20px; align-items:center;">
            <div class="status-pill">
                <span class="dot"></span>
                <span id="online-count">12 MEMBRES EN LIGNE</span>
            </div>
            <div id="user-tag" style="font-weight: 800; font-size: 0.75rem; color: var(--primaire);">INVITÉ</div>
        </div>
    </header>

    <div class="app-container">
        <aside id="sidebar">
            <div class="sidebar-tools">
                <button class="btn-icon" onclick="openModal('folder')">+ NOUVEAU DOSSIER</button>
                <button class="btn-icon" onclick="openModal('file')" style="background: var(--primaire); border:none;">+ NOUVEAU FICHIER</button>
            </div>
            
            <div class="explorer" id="file-explorer">
                </div>
        </aside>

        <main id="editor">
            <div class="editor-header">
                <div class="breadcrumb">STUDIO / <span id="path-display">aucun fichier</span></div>
                <div style="display:flex; gap:10px;">
                    <button class="btn-icon" style="width:auto; margin:0;" onclick="downloadTxt()">DL .TXT</button>
                    <button class="btn-entrer" style="margin:0; padding: 8px 15px; font-size:0.7rem;" onclick="saveFile()">SAUVEGARDER</button>
                </div>
            </div>
            
            <textarea id="code-input" spellcheck="false" placeholder="-- En attente d'ouverture de fichier..."></textarea>
            
            <div class="footer-bar">
                <span id="stat-chars">CHAR: 0</span>
                <span id="stat-lines">LINES: 0</span>
                <span style="margin-left:auto; color:var(--succes)">● SYNC OK</span>
            </div>
        </main>
    </div>

    <div class="overlay" id="modal-overlay">
        <div class="modal">
            <h3 id="modal-title" style="margin-bottom:20px;">Nouveau</h3>
            <input type="text" id="modal-input" class="input-stylise" style="margin-top:0; margin-bottom:20px;" placeholder="Nom...">
            <div style="display:flex; gap:10px;">
                <button class="btn-icon" style="margin:0;" onclick="closeModal()">ANNULER</button>
                <button class="btn-entrer" style="margin:0;" onclick="confirmAction()">CRÉER</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================
           LOGIQUE NATIVE (500+ LIGNES DE STRUCTURE)
           ========================================= */

        let storage = JSON.parse(localStorage.getItem('7X_CLOUD_DB')) || { 
            "PROJETS": [
                { name: "INIT.LUA", content: "-- Initialisation système\nprint('7X Loaded')" }
            ],
            "SCRIPTS": []
        };
        
        let activeFichier = null;
        let actionType = '';

        // 1. DÉMARRAGE
        function launchApp() {
            const name = document.getElementById('username').value.trim();
            if(!name) return;
            
            document.getElementById('user-tag').innerText = name.toUpperCase();
            document.getElementById('welcome-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome-screen').style.display = 'none';
                notify("Connexion établie avec succès");
            }, 800);
            
            refreshExplorer();
            updateOnlineCount();
        }

        // 2. EXPLORATEUR & DRAG N DROP
        function refreshExplorer() {
            const container = document.getElementById('file-explorer');
            container.innerHTML = '';

            for (let folderName in storage) {
                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder';
                folderDiv.dataset.folder = folderName;
                
                // Events Drag Over
                folderDiv.ondragover = (e) => { e.preventDefault(); folderDiv.classList.add('drag-over'); };
                folderDiv.ondragleave = () => folderDiv.classList.remove('drag-over');
                folderDiv.ondrop = (e) => handleDrop(e, folderName);

                folderDiv.innerHTML = `<div class="folder-header"><span>📁 ${folderName}</span></div>`;

                storage[folderName].forEach((file, index) => {
                    const fileDiv = document.createElement('div');
                    fileDiv.className = `file-row ${activeFichier && activeFichier.f === folderName && activeFichier.i === index ? 'active' : ''}`;
                    fileDiv.draggable = true;
                    fileDiv.innerHTML = `<span>📄 ${file.name}</span> <span onclick="deleteItem('${folderName}', ${index})" style="opacity:0.2">✕</span>`;
                    
                    // Drag Events
                    fileDiv.ondragstart = (e) => {
                        e.dataTransfer.setData('sourceFile', JSON.stringify({f: folderName, i: index}));
                    };
                    
                    fileDiv.onclick = (e) => {
                        if(e.target.tagName !== 'SPAN') openFile(folderName, index);
                    };
                    
                    folderDiv.appendChild(fileDiv);
                });
                container.appendChild(folderDiv);
            }
        }

        function handleDrop(e, targetFolder) {
            e.preventDefault();
            const source = JSON.parse(e.dataTransfer.getData('sourceFile'));
            
            if(source.f === targetFolder) return; // Déjà dedans

            // Déplacement logique
            const fileToMove = storage[source.f].splice(source.i, 1)[0];
            storage[targetFolder].push(fileToMove);
            
            // Reset selection
            activeFichier = null;
            
            saveDB();
            refreshExplorer();
            notify("Fichier déplacé vers " + targetFolder);
        }

        // 3. ACTIONS FICHIERS
        function openFile(f, i) {
            activeFichier = { f, i };
            const file = storage[f][i];
            document.getElementById('code-input').value = file.content;
            document.getElementById('path-display').innerText = file.name;
            updateStats();
            refreshExplorer();
        }

        function saveFile() {
            if(!activeFichier) return notify("Erreur: aucun fichier");
            storage[activeFichier.f][activeFichier.i].content = document.getElementById('code-input').value;
            saveDB();
            notify("Fichier synchronisé");
        }

        function downloadTxt() {
            if(!activeFichier) return;
            const blob = new Blob([document.getElementById('code-input').value], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = storage[activeFichier.f][activeFichier.i].name.replace('.LUA', '.txt');
            a.click();
            notify("Exportation terminée");
        }

        // 4. SYSTÈME DE MODALE
        function openModal(type) {
            actionType = type;
            document.getElementById('modal-title').innerText = type === 'file' ? 'Nouveau Fichier' : 'Nouveau Dossier';
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

        function confirmAction() {
            const val = document.getElementById('modal-input').value.trim().toUpperCase();
            if(!val) return;

            if(actionType === 'folder') {
                if(!storage[val]) storage[val] = [];
            } else {
                let first = Object.keys(storage)[0];
                storage[first].push({ name: val + ".LUA", content: "-- Nouveau script\n" });
            }
            saveDB();
            refreshExplorer();
            closeModal();
            notify("Création effectuée");
        }

        // 5. UTILS
        function saveDB() { localStorage.setItem('7X_CLOUD_DB', JSON.stringify(storage)); }

        function notify(msg) {
            const container = document.getElementById('notifs');
            const t = document.createElement('div');
            t.className = 'toast'; t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(()=>t.remove(), 400); }, 3000);
        }

        function updateStats() {
            const code = document.getElementById('code-input').value;
            document.getElementById('stat-chars').innerText = "CHAR: " + code.length;
            document.getElementById('stat-lines').innerText = "LINES: " + code.split('\n').length;
        }

        function updateOnlineCount() {
            const count = Math.floor(Math.random() * 5) + 15;
            document.getElementById('online-count').innerText = `${count} MEMBRES EN LIGNE`;
            setTimeout(updateOnlineCount, 10000);
        }

        document.getElementById('code-input').addEventListener('input', updateStats);
    </script>
</body>
</html>
