<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIRTUAL SERVEUR LUA | 7X</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-screen" class="fullscreen-overlay flex-center">
        <div class="modal-box">
            <h1>VIRTUAL SERVEUR LUA | <span class="accent">7X</span></h1>
            <p>IDENTIFICATION REQUISE</p>
            <input type="text" id="pseudo-input" placeholder="Entrez votre pseudo..." autocomplete="off" spellcheck="false">
            <button id="btn-login" class="btn-primary">CONNEXION</button>
        </div>
    </div>

    <div id="mobile-home" class="fullscreen-overlay flex-center hidden">
        <div class="mobile-menu-box">
            <h2 id="mobile-welcome"></h2>
            <p>SÉLECTIONNEZ UN MODE</p>
            <button id="btn-mode-code" class="btn-massive">MODE CODAGE</button>
            <button id="btn-mode-view" class="btn-massive btn-alt">MODE VISIONNEUSE</button>
        </div>
    </div>

    <div id="app-container" class="hidden">
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <span class="status-dot"></span>
                    <span id="user-display"></span>
                </div>
                <div class="sidebar-actions">
                    <button id="btn-new-file" class="icon-btn" title="Nouveau Fichier Lua">+F</button>
                    <button id="btn-new-folder" class="icon-btn" title="Nouveau Dossier">+D</button>
                </div>
            </div>
            <div id="file-tree" class="file-tree"></div>
        </aside>

        <main id="workspace">
            <header class="workspace-header">
                <div class="mobile-nav hidden-pc">
                    <button id="btn-back-menu" class="btn-outline">< RETOUR</button>
                </div>
                <div id="active-file-path" class="path-display">/root</div>
                <button id="btn-save" class="btn-primary btn-small">SAUVEGARDER</button>
            </header>
            
            <div id="editor-wrapper" class="content-wrapper">
                <textarea id="code-editor" spellcheck="false" autocomplete="off" placeholder="-- Saisissez votre code Lua ici..."></textarea>
            </div>
            
            <div id="viewer-wrapper" class="content-wrapper hidden">
                <pre id="code-viewer"><code></code></pre>
            </div>
        </main>
    </div>

    <div id="prompt-modal" class="modal-overlay hidden">
        <div class="modal-box small-modal">
            <h3 id="prompt-title"></h3>
            <input type="text" id="prompt-input" autocomplete="off" spellcheck="false">
            <div class="modal-actions">
                <button id="btn-prompt-cancel" class="btn-outline">ANNULER</button>
                <button id="btn-prompt-confirm" class="btn-primary">VALIDER</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
