<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRTUAL SERVEUR LUA | 7X</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            height: 100vh;
            flex-direction: column;
        }
        header {
            background-color: #11111b;
            padding: 15px 20px;
            border-bottom: 2px solid #89b4fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #workspace {
            display: flex;
            flex: 1;
        }
        #sidebar {
            width: 250px;
            background-color: #181825;
            padding: 20px;
            border-right: 1px solid #313244;
        }
        #editor-container {
            flex: 1;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 90%;
            background-color: #11111b;
            color: #a6e3a1;
            border: 1px solid #45475a;
            padding: 10px;
            font-size: 16px;
            resize: none;
        }
        button {
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #74c7ec; }
    </style>
</head>
<body>

    <header>
        <h2>VIRTUAL SERVEUR LUA | 7X</h2>
        <div id="greeting"></div>
    </header>

    <div id="workspace">
        <div id="sidebar">
            <h3>Mes Fichiers</h3>
            <button onclick="creerDossier()">+ Nouveau Dossier</button>
            <button onclick="creerFichier()">+ Fichier .lua</button>
            <ul id="file-list" style="list-style-type: none; padding-left: 0; margin-top: 20px;">
                <li>📁 <em>main_folder</em></li>
                <li>&nbsp;&nbsp;📄 script.lua</li>
            </ul>
        </div>

        <div id="editor-container">
            <h3>Éditeur Lua</h3>
            <textarea id="lua-code" placeholder="-- Tape ton code Lua ici..."></textarea>
            <button onclick="sauvegarderCode()">Sauvegarder</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            let username = localStorage.getItem("lua7x_username");

            if (!username) {
                username = prompt("Bienvenue sur VIRTUAL SERVEUR LUA | 7X. \nQuel est ton Username ?");
                if (username) {
                    localStorage.setItem("lua7x_username", username);
                } else {
                    username = "Anonyme";
                }
            }

            document.getElementById("greeting").innerText = `Salut ${username} !`;

            let savedCode = localStorage.getItem("lua7x_code");
            if (savedCode) {
                document.getElementById("lua-code").value = savedCode;
            }
        };

        function sauvegarderCode() {
            let code = document.getElementById("lua-code").value;
            localStorage.setItem("lua7x_code", code);
            alert("Code sauvegardé !");
        }

        function creerDossier() {
            prompt("Nom du dossier :");
            alert("Cette fonctionnalité sera gérée en JavaScript bientôt !");
        }

        function creerFichier() {
            prompt("Nom du fichier (ex: main.lua) :");
            alert("Cette fonctionnalité sera gérée en JavaScript bientôt !");
        }
    </script>
</body>
</html>
